[pytest]
testpaths = tests
addopts = -q -m "not torture"
# un test que pasa de 15 min vuelca la pila de cada hilo (no lo mata): un cuelgue en el CI dice
# en qué test y en qué línea quedó, en vez de un job cortado a los 60 min sin nombre
faulthandler_timeout = 900
markers =
    torture: tortura extendida de robustez (V6.1) — correr aparte con -m torture
    xdist_group(nombre): con pytest-xdist, el módulo corre entero en un worker (conftest: --dist loadgroup)
