# El CLA de los aportes (núcleo abierto, D7): CLA Assistant Lite dentro del repo, sin app externa
# con acceso a la cuenta de Mario. Quien abre un PR firma comentando la frase de abajo; la firma
# queda en la rama `cla-firmas` (firmas/cla.json), nunca en `main`. El job «CLA» es un check
# obligatorio de la regla de `main`.
#
# `pull_request_target` corre con el workflow de `main` y con permisos de escritura: por eso este
# job NUNCA hace checkout ni ejecuta código del PR; sólo lee comentarios y escribe la firma.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write        # re-correr el check del PR cuando alguien firma
  contents: write       # escribir firmas/cla.json en la rama cla-firmas
  pull-requests: write  # comentar en el PR
  statuses: write

jobs:
  CLA:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant Lite
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/mariorojasmz/apolo-cad/blob/main/docs/CLA.md
          path-to-signatures: firmas/cla.json
          branch: cla-firmas
          allowlist: mariorojasmz,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Gracias por tu aporte. Antes de revisarlo necesitamos que firmes una vez el
            [CLA](https://github.com/mariorojasmz/apolo-cad/blob/main/docs/CLA.md): comenta en este
            PR exactamente la frase de abajo. ·
            Thanks for your contribution. Before we review it, please sign the
            [CLA](https://github.com/mariorojasmz/apolo-cad/blob/main/docs/CLA.md) once by posting
            exactly the sentence below as a comment on this PR.
          custom-allsigned-prcomment: Todos firmaron el CLA · All contributors have signed the CLA.
          signed-commit-message: "cla: firma de @$contributorName en el PR #$pullRequestNo"
          create-file-commit-message: "cla: crea el registro de firmas"
          lock-pullrequest-aftermerge: false
