category: pernos
# Tornillos Allen de cabeza cilíndrica con hexágono interior (DIN 912), grado 8.8 (alta
# resistencia, comerciales). Se giran con llave Allen. La cabeza (Ø≈1.5·d, alto≈d) y el hueco
# hexagonal se derivan de d en el builder; la rosca se modela lisa. El largo del vástago lo fija
# quien lo usa (p. ej. el tensor de cola/motriz). `across_flats`/`head_h` quedan en specs solo
# para el cálculo de peso. LARGOS que se compran (`largo_min_mm`..`largo_max_mm`, sobre la
# serie de `library/largos_perno.py`): rango REFERENCIAL de las tablas de ISO 4762 (verificar
# con el proveedor).
# cost = USD REFERENCIAL por unidad (mercado aprox.; actualizar con proveedor para cotizar en firme).
families:
  - name_tpl: "Tornillo Allen {ref} 8.8"
    description_tpl: "Tornillo Allen (cabeza cilíndrica, hexágono interior) {ref} DIN 912 8.8 (se gira con llave Allen)."
    builder: socket_cap
    param_keys: [d]
    weight_formula: "7.85e-6 * (0.785 * d * d * 60 + 0.785 * (1.5*d) * (1.5*d) * d)"
    specs_common: {tipo: "tornillo Allen cabeza cilíndrica", material: "acero grado 8.8", grado: "8.8", norma: "DIN 912"}
    variants:
      - {ref: "PERNO-M10", d: 10, across_flats: 17, head_h: 10.0, cost: 0.35, largo_min_mm: 16, largo_max_mm: 100}
      - {ref: "PERNO-M12", d: 12, across_flats: 18, head_h: 12.0, cost: 0.5, largo_min_mm: 20, largo_max_mm: 120}
      - {ref: "PERNO-M16", d: 16, across_flats: 24, head_h: 16.0, cost: 0.9, largo_min_mm: 25, largo_max_mm: 160}
      - {ref: "PERNO-M20", d: 20, across_flats: 30, head_h: 20.0, cost: 1.6, largo_min_mm: 30, largo_max_mm: 200}
  # Pernos de cabeza HEXAGONAL DIN 933 (ISO 4017) 8.8, la tornillería estructural más común.
  # Los usa el super-comando join_bolted (V6.5b) para materializar una unión atornillada: el
  # largo del vástago lo fija join_bolted (grip + protrusión), aquí el peso es de un perno de
  # ~40 mm (REFERENCIAL). across_flats/head_h = cabeza DIN 933 (espejo de HEX_HEAD_MM en bolts.py).
# LARGOS que se compran (`largo_min_mm`..`largo_max_mm`, sobre la serie ISO 4017/4014 de
# `library/largos_perno.py`): rango comercial REFERENCIAL de DIN 933/931 en stock (criterio de
# diseño; verificar con el proveedor). Fuera del rango, join_bolted (criterio 3) lo rechaza y la
# puerta de publicación lo marca FALLA (plan puerta-de-publicacion D3).
  - name_tpl: "Perno hexagonal {ref} 8.8"
    description_tpl: "Perno cabeza hexagonal {ref} DIN 933 8.8 (unión atornillada; largo a medida)."
    builder: hex_bolt
    param_keys: [d, across_flats, head_h]
    weight_formula: "7.85e-6 * (0.785 * d * d * 40 + 0.866 * across_flats * across_flats * head_h)"
    specs_common: {tipo: "perno cabeza hexagonal", material: "acero grado 8.8", grado: "8.8", norma: "DIN 933"}
    variants:
      - {ref: "PERNO-HEX-M6", d: 6, across_flats: 10, head_h: 4.0, cost: 0.06, largo_min_mm: 10, largo_max_mm: 100}
      - {ref: "PERNO-HEX-M8", d: 8, across_flats: 13, head_h: 5.3, cost: 0.1, largo_min_mm: 12, largo_max_mm: 120}
      - {ref: "PERNO-HEX-M10", d: 10, across_flats: 16, head_h: 6.4, cost: 0.18, largo_min_mm: 16, largo_max_mm: 150}
      - {ref: "PERNO-HEX-M12", d: 12, across_flats: 18, head_h: 7.5, cost: 0.28, largo_min_mm: 20, largo_max_mm: 200}
      - {ref: "PERNO-HEX-M14", d: 14, across_flats: 21, head_h: 8.8, cost: 0.42, largo_min_mm: 25, largo_max_mm: 200}
      - {ref: "PERNO-HEX-M16", d: 16, across_flats: 24, head_h: 10.0, cost: 0.6, largo_min_mm: 25, largo_max_mm: 200}
      - {ref: "PERNO-HEX-M18", d: 18, across_flats: 27, head_h: 11.5, cost: 0.85, largo_min_mm: 30, largo_max_mm: 200}
      - {ref: "PERNO-HEX-M20", d: 20, across_flats: 30, head_h: 12.5, cost: 1.1, largo_min_mm: 35, largo_max_mm: 200}
      - {ref: "PERNO-HEX-M24", d: 24, across_flats: 36, head_h: 15.0, cost: 1.9, largo_min_mm: 45, largo_max_mm: 240}
  # ANCLAJE DE EXPANSIÓN (perno de anclaje mecánico de par controlado) para fijar una placa de
  # piso a concreto: espárrago + camisa de expansión + arandela + tuerca, se compra ARMADO y se
  # coloca por el agujero de la placa (taladro en el concreto = d; agujero en la placa = df).
  # Es un EJEMPLO (refs = ejemplo: lo reemplaza el equivalente que se consiga): del orden de Hilti
  # HST3 M12x115/20 o Fischer FAZ II 12/20, con evaluación técnica europea (EAD 330232) para
  # concreto. Lo que hay que respetar al cambiarlo: métrica M12, espesor a fijar ≥ placa
  # (tfix_max), profundidad de anclaje hef y par de instalación de SU ficha. Cotas sin verificar
  # contra la ficha del fabricante (`cotas_verificadas: false`); el 3D es representativo
  # (camisa no modelada). Origen del builder = cara de asiento de la arandela, vástago hacia −Z.
  - name_tpl: "Anclaje de expansión {ref}"
    description_tpl: "Anclaje de expansión M{d}×{length} (espárrago, camisa, arandela Ø{washer_d} y tuerca AF{across_flats}) para concreto; taladro Ø{d}, agujero en la placa Ø{df}, fija hasta {tfix_max} mm."
    builder: expansion_anchor
    param_keys: [d, length, sobre, across_flats, nut_h, washer_d, washer_t]
    weight_formula: "7.85e-6 * (0.785 * d * d * length + 0.866 * across_flats * across_flats * nut_h + 0.785 * washer_d * washer_d * washer_t)"
    specs_common: {tipo: "anclaje de expansión", material: "acero zincado", norma: "EAD 330232 (ETA del fabricante)", cotas_verificadas: false}
    variants:
      - {ref: "ANCLA-EXP-M12", d: 12, length: 115, sobre: 25, across_flats: 19, nut_h: 10, washer_d: 24, washer_t: 3, df: 14, hef: 70, tfix_max: 20, par_instalacion_nm: 60, linea_referencia: "del orden de Hilti HST3 M12x115/20 o Fischer FAZ II 12/20", cost: 1.6}
  # LARGOS MAYORES de la misma familia (2026-10-29: una calza o un mortero de nivelación bajo la
  # base también es espesor a fijar —la ETA lo cuenta en tfix— y el M12x115 sólo fija 20 mm).
  # Fuentes, con el mismo hef 70 (misma capacidad a tracción y corte que el de 115):
  # - Hilti HST3 (ETA-98/0001, EAD 330232): designación «M12×L tfix(hef 50)/tfix(hef 70)»; en
  #   stock M12x115 40/20 (art. 2105719), M12x125 50/30, M12x145 70/50 (art. 2105851) y M12x165
  #   (art. 2105852). Largo = sobre 25 + tfix + hef 70, la relación del M12x115 de arriba.
  # - fischer FAZ II Plus (ETA-19/0520 de DIBt, 24-05-2023): tabla A2.1, M12 con B = hef + tfix =
  #   100 / 120 / 140 para tfix 30 / 50 / 70 → hef 70 (las «12/30», «12/50», «12/70»); tabla B2.1,
  #   M12: taladro d0 12, agujero en la placa df ≤ 14, par de instalación 60 N·m, hef 50–125.
  # El 3D sigue siendo representativo (`cotas_verificadas: false`: arandela y tuerca).
      - {ref: "ANCLA-EXP-M12-125", d: 12, length: 125, sobre: 25, across_flats: 19, nut_h: 10, washer_d: 24, washer_t: 3, df: 14, hef: 70, tfix_max: 30, par_instalacion_nm: 60, linea_referencia: "del orden de Hilti HST3 M12x125 50/30 o fischer FAZ II Plus 12/30", fuente: "ETA-98/0001 (Hilti HST3) · ETA-19/0520 tablas A2.1 y B2.1 (fischer FAZ II Plus)", cost: 1.75}
      - {ref: "ANCLA-EXP-M12-145", d: 12, length: 145, sobre: 25, across_flats: 19, nut_h: 10, washer_d: 24, washer_t: 3, df: 14, hef: 70, tfix_max: 50, par_instalacion_nm: 60, linea_referencia: "del orden de Hilti HST3 M12x145 70/50 o fischer FAZ II Plus 12/50", fuente: "ETA-98/0001 (Hilti HST3) · ETA-19/0520 tablas A2.1 y B2.1 (fischer FAZ II Plus)", cost: 2.0}
      - {ref: "ANCLA-EXP-M12-165", d: 12, length: 165, sobre: 25, across_flats: 19, nut_h: 10, washer_d: 24, washer_t: 3, df: 14, hef: 70, tfix_max: 70, par_instalacion_nm: 60, linea_referencia: "del orden de Hilti HST3 M12x165 o fischer FAZ II Plus 12/70", fuente: "ETA-98/0001 (Hilti HST3) · ETA-19/0520 tablas A2.1 y B2.1 (fischer FAZ II Plus)", cost: 2.25}
