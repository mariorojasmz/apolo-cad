category: valvulas_neumaticas
# Electroválvulas de distribución genéricas (plan V8.9 D6, D16). Cada ref es un EJEMPLO por
# FUNCIÓN: se reemplaza por cualquier válvula de las mismas vías y posiciones, el mismo mando
# (posición de reposo), la misma rosca, una tensión de bobina igual y un caudal (C) no menor.
# Líneas de referencia (P1 de V8.9, provisoria): Festo y SMC como gama alta, Airtac como
# económica; `linea_referencia` sólo cita «del orden de». Montaje en la máquina o en un panel
# neumático propio, NUNCA dentro del tablero eléctrico (D6).
#
# Ficha neumática (`library/neumatica/ficha.py`): vías por ISO 5599-3 (1 alimentación, 2 y 4
# trabajo, 3 y 5 escape), pilotaje interno (sin puertos 12/14), bobinas en el lado 14 (5/2 monoestable), 14 y 12 (dos bobinas) o 12 (3/2: conecta 1→2),
# caudal ISO 6358 como C y b o como Qn de 6 a 5 bar, que la ficha convierte (D3).
# Ficha eléctrica (V8.9 F1b, `library/neumatica/bobinas.py`): cada bobina es una carga `bobina`
# del mando, como la de un contactor (la red eléctrica la ve): una sola, bornes A1/A2; dos,
# 14A1/14A2 y 12A1/12A2. Montaje de campo (fuera del tablero, D6). Sin `modelo` eléctrico
# todavía: la potencia de la bobina y su modelo de co-simulación son de F3 (sin ellos la red de
# la co-simulación no la carga y lo dice como hipótesis).
# Fuentes (lo que no tiene fuente va en `a_confirmar`):
#  [V1] Festo VUVG-L14-M52-AT-G18 (576256), 5/2 monoestable G1/8: Qn 680–730 L/min, 2,5–8 bar,
#       conmutación 14 ms / 22 ms, 24 VDC 1 W, accionamiento manual (hoja del distribuidor
#       klefinghaus.de). Se toma el Qn MENOR (680): el reemplazo debe dar al menos eso.
#  [V2] Festo VUVG-L14 5/3 centro cerrado G1/8 (566510): Qn 620–650 L/min (listado del
#       distribuidor coastpneumatics.com).
#  [V3] SMC VF3130, 5/2 monoestable G1/4: C = 4,0 dm³/(s·bar) de 1→4/2 y 3,1 de 4/2→5/3, Cv 1,0 y
#       0,75 (listado del distribuidor Motion); la conversión de Cv con b = 0,3 da 3,99 y 2,99
#       (`tests/test_neumatica_iso6358.py`), coherente con la ficha.
#  [V4] Airtac 4V210-08, 5/2 G1/4: Cv 1,1, 0,15–0,8 MPa (listado del distribuidor KTB Europe).
#  [V5] Festo VUVG-L14-T32U-MT-G18 (2×3/2 normalmente abierta, G1/8): Qn 480–500 L/min, y
#       VUVG-L18 2×3/2 cerrada G1/4: 880 L/min (hojas de Festo en klefinghaus.de y rs-online):
#       el ORDEN de una 3/2 del mismo tamaño, a confirmar.
# Criterios de diseño y a confirmar:
#  - `b` = 0,3 en todas: ninguna fuente leída publica b (SMC lo publica en su ficha completa):
#    hipótesis declarada (D3) hasta leerla;
#  - la referencia del Qn de Festo se toma ANR (ISO 8778), a confirmar con su ficha;
#  - el rango de presión es el MÁS ESTRECHO de las líneas citadas (vale para cualquiera);
#  - biestables y 5/3 de escape y de presión: el caudal y los tiempos de su hermana de la misma
#    línea y tamaño, a confirmar; la caja es una envolvente provisoria del cuerpo con la bobina.
_puertos_5_g18: &puertos_5_g18
  - {id: "1", rol: alimentacion, rosca: G1/8}
  - {id: "2", rol: trabajo, rosca: G1/8}
  - {id: "3", rol: escape, rosca: G1/8}
  - {id: "4", rol: trabajo, rosca: G1/8}
  - {id: "5", rol: escape, rosca: G1/8}
_puertos_5_g14: &puertos_5_g14
  - {id: "1", rol: alimentacion, rosca: G1/4}
  - {id: "2", rol: trabajo, rosca: G1/4}
  - {id: "3", rol: escape, rosca: G1/4}
  - {id: "4", rol: trabajo, rosca: G1/4}
  - {id: "5", rol: escape, rosca: G1/4}
_caudal_g18: &caudal_g18 {Qn_l_min: 680, referencia: ANR, p1_bar: 6, p2_bar: 5, b: 0.3}
_caudal_g14: &caudal_g14 {C: 4.0, b: 0.3}
_escape_g14: &escape_g14 {C: 3.1, b: 0.3}
_fuente_g18: &fuente_g18 "Festo VUVG-L14-M52-AT-G18 (576256): Qn, presión, tiempos y bobina (hoja del distribuidor klefinghaus.de)"
_fuente_g14: &fuente_g14 "SMC VF3130 (listado Motion: C 4,0 / 3,1, Cv 1,0 / 0,75); Airtac 4V210-08 (listado KTB: Cv 1,1, 0,15–0,8 MPa)"
_ele_1bobina: &ele_1bobina
  funcion: Q
  simbolo: bobina_electrovalvula
  montaje: campo
  bornes: [{id: A1, rol: bobina}, {id: A2, rol: bobina}]
  cargas: [{bornes: [A1, A2], tension: "24 VDC", tipo: bobina}]
_ele_2bobinas: &ele_2bobinas
  funcion: Q
  simbolo: bobinas_electrovalvula
  montaje: campo
  bornes: [{id: 14A1, rol: bobina}, {id: 14A2, rol: bobina}, {id: 12A1, rol: bobina}, {id: 12A2, rol: bobina}]
  cargas: [{bornes: [14A1, 14A2], tension: "24 VDC", tipo: bobina}, {bornes: [12A1, 12A2], tension: "24 VDC", tipo: bobina}]
