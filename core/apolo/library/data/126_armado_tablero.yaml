  # ── prensaestopas de plástico, rosca métrica (EN 62444; V8.5 F3, D7) ─────────────────────
  # `tablero.prensaestopas`: el rango de Ø de cable que sujeta y sella y la entrecara del
  # hexágono, de la ficha de la línea de referencia (LAPP SKINTOP ST-M, poliamida, RAL 7001). La
  # caja del builder es la envolvente (hexágono × largo total): no se dibuja en el tablero (F3 lo
  # elige y lo compra; la geometría, si hace falta, es otra fase). Rangos que se solapan: se elige
  # la MENOR rosca cuyo rango contiene el Ø (`library/electrico/prensaestopas.py`).
