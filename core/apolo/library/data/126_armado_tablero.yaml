category: tableros
# Armado interior del tablero (plan V8.5, D9): rieles DIN, canaletas ranuradas y los topes de la
# bornera. No son aparatos (sin bloque `electrico`): no tienen bornes ni designación; el layout
# del tablero los corta y los coloca, y la BOM los compra por metro (riel, canaleta) o por pieza.
#  - ref GENÉRICA por rol, sin marca; `specs.linea_referencia` = «orden de …» de las marcas del
#    plan madre (P2: Schneider, Siemens, ABB; Chint o LS económica); `cotas_verificadas: false`;
#  - cost / cost_por_m = USD REFERENCIAL (mercado de Lima, aprox.); verificar con el proveedor;
#  - riel y canaleta son CORTABLES a lo largo de Z (`builders_tablero.py`): sección en XY, Y = lo
#    que sale de la placa (`tablero.apoyo` −Y por familia); peso en kg/m;
#  - canaleta: `tablero.canaleta.seccion_util_mm2` = el interior que llenan los conductores con
#    la tapa puesta (orden de la ficha: interior menos los dedos), la que usa el llenado de D3.
components:
  # ── riel DIN sombrero TH35 (EN 60715) ───────────────────────────────────────────────────
  - ref: RIEL-DIN-TH35-7.5
    name: Riel DIN TH35×7,5 perforado
    description: Riel DIN sombrero de 35 × 7,5 mm (EN 60715), acero zincado de 1 mm, perforado; para aparatos modulares, bornes y fuentes. Se corta a medida y se atornilla a la placa de montaje cada 100–150 mm. Verificar con el proveedor.
    builder: din_rail
    params: {alto: 7.5, espesor: 1.0}
    tablero: {riel: {norma: "EN 60715", perfil: "TH35-7,5"}}
    weight: 0.33
    cuttable: true
    default_length: 1000
    specs: {perfil: "TH35-7,5", norma: "EN 60715", material: "acero zincado", espesor_mm: 1.0, linea_referencia: "orden de Schneider AM1DP200 / ABB / Chint", cotas_verificadas: false, cost_por_m: 2.5}
  - ref: RIEL-DIN-TH35-15
    name: Riel DIN TH35×15 perforado
    description: Riel DIN sombrero de 35 × 15 mm (EN 60715), acero zincado de 1,5 mm, perforado; el alto de 15 deja pasar conductores por debajo y aguanta aparatos pesados. Se corta a medida. Verificar con el proveedor.
