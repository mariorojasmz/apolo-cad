  # ── KEC-…-S: sostiene y FRENA un movimiento (categoría 1 de EN ISO 13849-1) ───────────────
  - ref: BLOQ-VAST-16-S
    name: Bloqueo de vástago Ø16 por resorte, apto para frenado (categoría 1)
    description: Unidad de sujeción para vástago Ø16 (ISO 15552 Ø40), normalmente bloqueada por resorte y liberada con aire (≥ 3,8 bar), 1300 N de retención estática en los dos sentidos; sostiene y frena un movimiento; componente probado para categoría 1 de EN ISO 13849-1 (PL c). Va entre la tapa delantera del cilindro y su brida (patrón TG 38). Verificar con el proveedor.
    builder: bloqueo_vastago
    params: {ancho: 54, alto: 54, largo: 160, d: 16, B: 35, VD: 18}
    weight: 1.860
    specs: {d_vastago_mm: 16, F_retencion_N: 1300, TG_mm: 38, rosca_fijacion: M6, T_servicio_C: "-10…60", linea_referencia: "orden de Festo KEC-16-S (538242)", fuente: "[B1] [B2]", a_confirmar: "cotas E, L1, L2 y VD (leídas sin su dibujo); lado del centrado; vástago del cilindro L1 más largo", cotas_verificadas: false}
    neumatico:
      funcion: RL
      simbolo: bloqueo_vastago
      fuente: *fuente_kec_s
      puertos: *puerto_g18
      modelo: {tipo: bloqueo_vastago, d_vastago_mm: 16, F_retencion_N: 1300, p_liberacion_min_bar: 3.8, p_min_bar: 3.8, p_max_bar: 8, normalmente_bloqueado: true, frenado_dinamico: true, V_liberacion_cm3: 8, t_mecanico_ms: 10, categoria_iso13849: 1, PL: c, certificado: "IFA 1504155", holgura_axial_mm: 0, cilindro_D_mm: 40}
      a_confirmar: *ac_kec
