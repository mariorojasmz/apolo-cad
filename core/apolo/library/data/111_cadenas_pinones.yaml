    description: "Cadena de rodillos simple ASA 40 (ANSI B29.1, paso 1/2\" = 12.7 mm), rodillo Ø7.92, ancho interior 7.85; rotura 13.9 kN; 0.62 kg/m. ASA 40 y 08B NO son intercambiables aunque las dos sean de 1/2\"."
