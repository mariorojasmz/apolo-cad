category: transmision
# CADENAS DE RODILLOS Y PIÑONES reales. Plan: docs/plans/cadenas-pinones.md (D1-D6, D10, D11).
# Builders: sprocket y roller_chain (library/builders_transmision.py); matemática pura en
# library/transmision.py. Prefijo 111: carga al final y no reordena el enum de insert_component.
#
# DOS NORMAS (D1). ASA = ANSI B29.1 («americana»; en Lima, «ASA 40»), la de más stock en Lima y
# la del rodillo a rodillo americano. BS = ISO 606 serie B («europea»: 08B, 10B, 12B), repuestos
# de máquinas europeas o chinas y cabezales tipo Interroll. ASA 40 y 08B son de 1/2" las dos pero
# NO son intercambiables (rodillo 7.92 vs 8.51, ancho interior 7.85 vs 7.75): cada ref lo dice.
#
# MARCO DEL PIÑÓN: eje +Z, origen en el plano medio de la hilera 1, cubo hacia -Z, un asiento de
# diente centrado en +X (centro del asiento en (d0/2, 0, 0)); hilera 2 en z = -distancia_hileras.
# Anclas por familia: eje, hilera_1, hilera_2 (dos hileras) y fase. MARCO DE LA CADENA RECTA:
# a lo largo de X centrada, pernos paralelos a Z, hilera 1 en z = 0 y hilera 2 en z = -pt.
#
# LO NO PUBLICADO SE DECLARA (D3): [L] leído de la ficha, [D] derivado por fórmula, [E] estimado.
# Cada ref lista sus [D]/[E] en `no_publicado`. Los flancos son la forma ISO 606 máxima
# (ri mín, re máx, alfa máx): representativos; chavetero y prisionero no se modelan (el piloto se
# maquina en taller). Pesos [E] = volumen del 3D x 7.85e-6 kg/mm3; el 3D reproduce los pesos
# publicados (0.27 vs 0.281 la 40B14; 3.84 vs 3.79 la 08B-2 z38), así que el estimado es honesto.
#
# FUENTES. Cadenas: iwis ELITE pp. 26-29 (tabla ISO 606), Tsubaki EU y US. Piñones ASA 40-1 tipo
# B: Tsubaki US 40B<z> (https://chains.ustsubaki.com, «No. 40 plain bore sprockets»; Martin
# 40B15/16 coinciden); ASA 40-2: Tsubaki D40B14 y Martin D40B15H; ASA 40 doble-simple: Tsubaki
# DS40A15. 08B-1: TYMA y Chiaravalli (SKF lo verifica); 08B-2: Chiaravalli; 08B-1 doble-simple:
# TYMA 08B-1-z-DS; 10B-1 y 12B-1: TYMA. Fórmulas: ISO 606 (transcrita en patentes) y ANSI B29.1.
#
# SIN `cost` (D4). Precios de referencia para cotizar (Rodasur, Av. Guillermo Dansey 1912,
# Cercado; marca Donghua, sin decir si incluyen IGV; 2026-10-08): piñón ASA 40-1 14T S/12,
# 15T S/16, 30T S/32; 08B-1 14T S/14; cadena ASA 40-1 Max-Gold S/18 (no queda claro si por metro
# o por caja). El costeo cae a su estimación por peso y la declara.
