category: pies_niveladores
# Pies niveladores ajustables: vástago roscado (eje Z) sobre un disco o una base de apoyo.
# Builders leveling_foot (library/builders_estructura.py) y leveling_foot_base
# (library/builders_fijacion.py).
#
# LA FICHA DE CADA PIE (plan pie-nivelador D5/D6; la fila de compra la lee library/pies_ficha.py):
#   rosca, altura (largo del vástago roscado), base (disco fijo | articulada | placa de anclaje,
#   con disco_d o base_l x base_b), articulacion_grados (si la ficha la da), sw (hexágono de llave
#   con que se gira el vástago), tuerca_incluida (la tuerca de bloqueo viene con el pie o no) y
#   tuerca, material (el del VÁSTAGO: el que rosca; la base de otro material va en material_base),
#   carga_kg = carga de SERVICIO por pie (la que juzga `apoyo.capacidad` con su FS 1,5) y la cifra
#   de la ficha de la que sale (carga_estatica_kn admisible, o carga_rotura_n con su factor),
#   fuente y cotas_verificadas.
#
# CÓMO SE MODELA (builder leveling_foot, de abajo arriba): disco_d x disco_t, cuerpo de la base
# cuerpo_d x cuerpo_h (rótula, manguito), hexágono de llave sw x sw_h y el vástago Ø rosca x
# altura; la tuerca de bloqueo INCLUIDA (tuerca_sw x tuerca_m) va enroscada con su cara de arriba
# a MEDIA rosca: la pose de diseño es la mitad de la carrera. Lo que la ficha no publica (el
# reparto de alturas dentro de la base, la altura del hexágono, el Ø de la rótula) es
# REPRESENTATIVO y cada familia lo dice en `no_publicado`.
families:
  # Los PIE-M* de siempre (ids estables, geometría congelada en tests/test_pies_niveladores.py):
  # genéricos sin fabricante citado; cotas y carga del orden de los pies de disco fijo de acero.
  - family: "PIE"
    name_tpl: "Pie nivelador {ref}"
    description_tpl: "Pie nivelador M{rosca}, ajuste {altura} mm, disco Ø{disco_d} mm."
    builder: leveling_foot
    param_keys: [rosca, altura, disco_d, disco_t]
    weight_formula: "7.85e-6 * 0.785 * (rosca * rosca * altura + disco_d * disco_d * disco_t)"
    specs_common: {tipo: "pie nivelador", material: "acero zincado", ajustable: true,
                   base: "disco fijo", tuerca_incluida: false, cotas_verificadas: false}
    variants:
      - {ref: "PIE-M8-30", rosca: 8, altura: 30, disco_d: 60, disco_t: 10, carga_kg: 120}
      - {ref: "PIE-M10-40", rosca: 10, altura: 40, disco_d: 75, disco_t: 12, carga_kg: 200}
      - {ref: "PIE-M12-50", rosca: 12, altura: 50, disco_d: 90, disco_t: 14, carga_kg: 350}
  # PIE NIVELADOR CON BASE DE ANCLAJE (F8 de plantilla-rodillos-cadena, E10): la misma rosca,
  # recorrido y carga que el PIE-M* de su métrica, sobre una base rectangular con 2 agujeros para
  # anclarla DIRECTO al concreto (sin placa de piso ni soldadura: la base es zincada). Se nivela
  # girando el vástago con la contratuerca suelta, sin tocar los anclajes. Builder
  # leveling_foot_base (origen = centro del vástago, como leveling_foot). Es un EJEMPLO (refs =
  # ejemplo): lo que hay que respetar al cambiarlo es la rosca, el recorrido, la carga, el paso
  # entre agujeros (los anclajes caen fuera de la placa de la pata) y el agujero para el anclaje
  # de catálogo (`anclaje`). Cotas sin verificar contra la ficha del fabricante.
  - family: "PIE-BA"
    name_tpl: "Pie nivelador con base de anclaje {ref}"
    description_tpl: "Pie nivelador M{rosca}, ajuste {altura} mm, base {base_l}×{base_b}×{disco_t} con 2 agujeros Ø{agujero_d} a {paso_agujeros} mm para anclar al piso."
    builder: leveling_foot_base
    param_keys: [rosca, altura, base_l, base_b, disco_t, agujero_d, paso_agujeros]
    weight_formula: "7.85e-6 * (0.785 * rosca * rosca * altura + (base_l * base_b - 2 * 0.785 * agujero_d * agujero_d) * disco_t)"
    specs_common: {tipo: "pie nivelador con base de anclaje", material: "acero zincado", ajustable: true,
                   base: "placa de anclaje", tuerca_incluida: false,
                   anclaje: "ANCLA-EXP-M12", cotas_verificadas: false,
                   linea_referencia: "del orden de los pies niveladores con base de fijación al piso de Elesa o Ganter"}
    variants:
      - {ref: "PIE-BA-M8-30", rosca: 8, altura: 30, base_l: 190, base_b: 80, disco_t: 10, agujero_d: 14, paso_agujeros: 140, carga_kg: 120}
      - {ref: "PIE-BA-M10-40", rosca: 10, altura: 40, base_l: 190, base_b: 80, disco_t: 12, agujero_d: 14, paso_agujeros: 140, carga_kg: 200}
      - {ref: "PIE-BA-M12-50", rosca: 12, altura: 50, base_l: 190, base_b: 80, disco_t: 14, agujero_d: 14, paso_agujeros: 140, carga_kg: 350}

  # -------------------------------------------------------------------------------------------
  # PIE ARTICULADO DE ESPÁRRAGO, BASE DE ACERO (del orden de Ganter GN 343.2, tipo OS sin
  # casquete). Ficha: Ganter GN 343.1 / GN 343.2 «Leveling Feet, Steel», tabla métrica
  # (catálogo J.W. Winco § 3.4; copia en la F0 del plan pie-nivelador). Leído de la ficha:
  #   d1 (Ø base) 25–60; rosca M6–M24; l1 (largo del espárrago) por rosca y base: M8 40/50/63,
  #   M10 50/63/80, M12 63/80/100, M16 63/80/100 (d1 50) u 80/100/125 (d1 60), M20–M24
  #   98/138/158; l2 (altura de la base, tipo OS) 19/23/26/28/36 y l4 (espesor del ala de la
  #   base) 4/5/6/7/8,5 para d1 25/32/40/50/60; A/F 12–24; espárrago clase 5.8 zincado; base de
  #   acero zincada; incluye tuerca hexagonal ISO 4032.
  #   Carga estática: 14 kN (M8), 23 (M10), 33 (M12), 40 (M16 d1 50), 62 (M16 d1 60), 95 (M20).
  #   La ficha la da como ADMISIBLE («results from the permissible load capacity of the threaded
  #   stud (property class 5.8)»), para carga puramente vertical sobre la rótula: carga_kg =
  #   carga estática / g, sin otro factor (la puerta ya aplica FS 1,5 sobre la reacción). Con carga
  #   inclinada o flexión la ficha avisa que baja: es lo que cubre ese FS.
  #   ISO 4032 (m máx / s): M8 6,8/13 · M10 8,4/16 · M12 10,8/18 · M16 14,8/24 · M20 18,0/30.
  # Ojo: la designación de espárrago es GN 343.2 (GN 343.1 es la de rosca INTERIOR).
  - family: "PIE-ART"
    name_tpl: "Pie nivelador articulado {ref}"
    description_tpl: "Pie nivelador articulado de espárrago M{rosca} × {altura} mm (clase 5.8 zincado), base de acero Ø{disco_d} mm, hexágono SW{sw}, tuerca ISO 4032 incluida; carga estática admisible {carga_estatica_kn:g} kN. Del orden de {designacion_fabricante}."
    builder: leveling_foot
    param_keys: [rosca, altura, disco_d, disco_t, cuerpo_d, cuerpo_h, sw, sw_h, tuerca_sw, tuerca_m]
    weight_formula: "7.85e-6 * (0.785 * (rosca * rosca * altura + disco_d * disco_d * disco_t + cuerpo_d * cuerpo_d * cuerpo_h) + 0.866 * sw * sw * sw_h + (0.866 * tuerca_sw * tuerca_sw - 0.785 * rosca * rosca) * tuerca_m)"
    specs_common:
      tipo: "pie nivelador articulado de espárrago"
      material: "acero zincado"
      clase_esparrago: "5.8"
      ajustable: true
      base: "articulada"
      tuerca_incluida: true
      fabricante: "Ganter (Elesa+Ganter)"
      serie: "GN 343.2"
      fuente: "ficha Ganter GN 343.1 / GN 343.2, tabla métrica (catálogo J.W. Winco § 3.4)"
      carga_fuente: "carga estática ADMISIBLE de la ficha (espárrago clase 5.8, carga vertical) / g"
      cotas_verificadas: true
      no_publicado: "ángulo de articulación; Ø de la rótula (cuerpo_d ≈ 0,6·d1) y altura del hexágono (sw_h ≈ 0,5·SW) representativos; el hexágono se modela en el espárrago sobre la base"
      linea_referencia: "del orden de Ganter GN 343.2 tipo OS (pie articulado de espárrago con base de acero)"
