  # PIE ARTICULADO CON BASE DE TECNOPOLÍMERO (del orden de Elesa LV.A, sin disco antideslizante).
  # Ficha: Elesa «Levelling elements» LV.A, catálogo general pág. 1192–1194 (7/2018). Leído de la
  # ficha (columnas D d L l l1 h s, articulación en grados, «max. limit static load» y peso):
  #   base PA con fibra de vidrio negra, vástago de acero zincado con hexágono de regulación s;
  #   L = altura total, l = largo roscado, l1 = altura del piso al inicio de la rosca, h = altura
  #   de la base. Serie 80-14: l1 33, h 24, s 14, 14°, 16 000 N; serie 80-24: l1 43, h 24, s 24,
  #   24°, 18 000 N. La tuerca NO viene: es accesorio a pedido (Elesa NT., acero zincado).
  #   ⚠ La carga de la ficha es de ROTURA («the value above which the load … may cause some
  #   plastic material breakage»: la ficha pide aplicar un factor). Factor aplicado: 4 (criterio
  #   de diseño: un tecnopolímero cargado en el tiempo flue y rompe por debajo de su rotura corta;
  #   el mismo FS 4 que se pide sobre el MOR de la madera) → carga_kg = carga_rotura_n / 4 / g.
  # REPRESENTATIVO: el reparto de la base en disco (8 mm) + cuerpo Ø D/2 (h − 8); la altura del
  # hexágono es l1 − h. Peso: el de la ficha (sin disco antideslizante).
  - family: "PIE-TP"
    name_tpl: "Pie nivelador articulado de base de tecnopolímero {ref}"
    description_tpl: "Pie nivelador articulado M{rosca} × {altura} mm (vástago de acero zincado, hexágono SW{sw}), base de tecnopolímero Ø{disco_d} mm articulada {articulacion_grados}°, sin tuerca; carga de servicio {carga_kg} kg (rotura {carga_rotura_n} N / 4). Del orden de {designacion_fabricante}."
    builder: leveling_foot
    param_keys: [rosca, altura, disco_d, disco_t, cuerpo_d, cuerpo_h, sw, sw_h]
    specs_common:
      tipo: "pie nivelador articulado de base de tecnopolímero"
      material: "acero zincado"
      material_base: "tecnopolímero PA (poliamida con fibra de vidrio)"
      ajustable: true
      base: "articulada"
      tuerca_incluida: false
      tuerca: "aparte (accesorio Elesa NT., acero zincado)"
      fabricante: "Elesa (Elesa+Ganter)"
      serie: "LV.A"
      fuente: "ficha Elesa LV.A, catálogo general pág. 1192–1194 (7/2018)"
      carga_fuente: "carga de ROTURA de la ficha / factor 4 (criterio de diseño) / g"
      factor_rotura: 4
      cotas_verificadas: true
      no_publicado: "forma de la base (disco de 8 mm + cuerpo Ø D/2) representativa; la ficha da su Ø y su altura h"
      linea_referencia: "del orden de Elesa LV.A (pie articulado de base de tecnopolímero)"
    variants:
      - {ref: "PIE-TP-80-M10-43", designacion_fabricante: "LV.A-80-14-M10x43", rosca: 10, altura: 43, disco_d: 80, disco_t: 8, cuerpo_d: 40, cuerpo_h: 16, sw: 14, sw_h: 9, articulacion_grados: 14, carga_rotura_n: 16000, carga_kg: 407, weight: 0.092}
