category: proteccion_electrica
# Seccionamiento y protección de la faja piloto (plan V8.1 D6). Convenciones del catálogo
# eléctrico: ver la cabecera de 120_alimentacion_electrica.yaml.
#  - ITM = interruptor termomagnético (así se pide en Perú); curva C = disparo magnético entre
#    5 y 10 In (IEC 60898-1). En la red de 220 V SIN neutro de Lima, un circuito de mando entre
#    dos fases se protege con un ITM de 2 polos (los dos son fases); el 1P+N es para redes con
#    neutro (su polo N se maniobra pero no se protege).
#  - Guardamotor = interruptor automático de motor de clase 10 (térmico regulable + magnético);
#    rangos del orden de TeSys GV2ME06/07/08/10/14, Ii ≈ 13 × Ir máx. Protege al motor:
#    `protege_motor: true` (regla «protección del motor» del ERC).
#  - `electrico.modelo` (plan V8.3 D7; convención en 120_alimentacion_electrica.yaml). Las
#    curvas son de NORMA y van en el modelo (`cosim/modelos/protecciones.py`), no aquí: ITM
#    IEC 60898-1 (térmico 1,13/1,45 In, 2,55 In entre 1 y 60 s; magnético B 3–5, C 5–10,
#    D 10–20 In); guardamotor y relé térmico IEC 60947-4-1 (1,05/1,2 Ir; a 7,2 Ir en frío, la
#    banda de su `clase`). El `Ir_A` del guardamotor y del relé es un AJUSTE obligatorio
#    (el dial); el magnético del guardamotor es FIJO en `Ii_A` = 13 × Ir máx, no sigue al dial.
#    El relé térmico sale de fábrica en rearme MANUAL (`rearme`). El cartucho del portafusible
#    (125_) es un ajuste: In dentro del rango del portafusible, curva T por defecto.
#  - `electrico.datos` (plan datos-de-corte-y-acometida, D1–D5): lo que lee quien VERIFICA, fuera
#    de `modelo` (no entra a la firma del documento). Cada cifra sale de la ficha del fabricante
#    que nombra `fuente` (la ref es un EJEMPLO: quien fabrica la reemplaza por la equivalente
#    local que cumpla esas cifras); lo que no se verificó va en `a_confirmar` SIN valor.
#    · ITM y guardamotor: Icu/Ics de IEC 60947-2 como mapa {U_V: kA}; la clave es el TOPE del
#      rango de la ficha («220…240 V» → 240, «380…415 V» → 415). La Icn de IEC 60898-1 sigue en
#      `modelo`.
#    · Seccionador: Icw + su duración y la corriente condicional Iq con la protección con que se
#      ensayó (IEC 60947-3).
#    · `T_max_C`: el tope de la «temperatura ambiente de funcionamiento» de la ficha de la línea
#      (por familia, en el ancla).
#    · Diferencial: la corriente condicional de cortocircuito Inc con la protección con que se
#      ensayó y el poder de cierre y corte asignado Im (IEC 61008-1).
#  - Diferencial = interruptor diferencial SIN protección de sobrecorriente (RCCB, IEC 61008-1):
#    se compone con un ITM aguas abajo o arriba. `modelo`: In, sensibilidad `IDn_mA`, clase de
#    corriente residual (`clase_residual`: AC, A, F o B) y polos; las bandas de disparo son de
#    NORMA y van en el modelo (`cosim/modelos/diferencial.py`). Todos sus polos, el N incluido,
#    son caminos `proteccion` de LÍNEA (`de`) a CARGA (`a`): la residual es la suma de sus fasores.
#    Un variador trifásico aguas abajo pide clase B (regla «tipo de diferencial» del ERC).
_datos_itm: &datos_itm {T_max_C: 70}
_datos_gm: &datos_gm {T_max_C: 60}
_datos_secc: &datos_secc {T_max_C: 50}
_polos_3p: &polos_3p
  - {id: "1", rol: potencia, lado: linea}
  - {id: "2", rol: potencia, lado: carga}
  - {id: "3", rol: potencia, lado: linea}
  - {id: "4", rol: potencia, lado: carga}
  - {id: "5", rol: potencia, lado: linea}
  - {id: "6", rol: potencia, lado: carga}
_proteccion_3p: &proteccion_3p
  - {de: "1", a: "2", tipo: proteccion}
  - {de: "3", a: "4", tipo: proteccion}
  - {de: "5", a: "6", tipo: proteccion}
components:
  # ── seccionador general (IEC 60204-1 §5.3) ─────────────────────────────────────────────
  - ref: SECC-25A-3P
    name: Seccionador rotativo 3P 25 A
    description: Interruptor-seccionador rotativo de 3 polos 25 A con manija roja sobre fondo amarillo bloqueable con candado, para el seccionamiento general del tablero. Verificar con el proveedor.
    builder: box
    params: {width: 60, depth: 80, height: 75}
    tablero: {puerta: {delante_mm: 30, detras_mm: 50}}
    weight: 0.25
    specs: {Ith_A: 25, polos: 3, candado: true, linea_referencia: "orden de Schneider TeSys Vario VCF1 / Siemens 3LD2 / ABB OT25", cotas_verificadas: false, cost: 45}
    electrico: &seccionador
      funcion: Q
      simbolo: seccionador_3p
      montaje: puerta
      perdidas_W: 1.5
      bornes: *polos_3p
      caminos:
        - {de: "1", a: "2", tipo: NA, accion: mano}
        - {de: "3", a: "4", tipo: NA, accion: mano}
        - {de: "5", a: "6", tipo: NA, accion: mano}
      modelo: {tipo: seccionador, Ith_A: 25, polos: 3}
      # Icw 384 A 1 s y Iq 10 kA a 400 V con fusible gG o aM de 35 A (IEC 60947-3); −20…50 °C
      datos: {<<: *datos_secc, Icw_kA: 0.384, Icw_t_s: 1, Iq_kA: 10, Iq_con: "fusible gG 35 A (o aM 35 A), a 400 V"}
      fuente: "Schneider Electric, ficha de producto TeSys Vario VCF1 (Ithe 25 A; schneider-electric.cn, 2026-10-24)"
  - ref: SECC-40A-3P
    name: Seccionador rotativo 3P 40 A
