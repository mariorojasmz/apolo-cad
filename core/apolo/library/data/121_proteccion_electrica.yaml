  # ── interruptores diferenciales (RCCB, IEC 61008-1) ─────────────────────────────────────
  # Las cifras de ficha (Inc con su protección, Im y la temperatura de funcionamiento) salen de
  # las fichas Schneider Acti9 iID de cada ref (consultadas 2026-10-26; bitácora «Cifras de fichas
  # y líneas corregidas» del plan datos-de-corte-y-acometida). In, IΔn, clase y polos son lo que
  # DEFINE la ref (lo que hay que respetar al reemplazarla por la local). `specs.frecuencia_ficha`
  # es la frecuencia de la ficha leída: la de clase B (B-SI) es de 50 Hz y la red de Lima es de
  # 60 Hz, así que «apto a 60 Hz» queda en `specs.a_confirmar` (decisión D-a: la cifra se carga,
  # nunca se afirma lo que la ficha no dice).
  #  Inc_con: la ficha no nombra la protección; el catálogo Acti 9 da «con iC60N/H/L: igual al
  #  poder de corte del iC60; con fusible: 10 000 A» sin calibre, y el calibre máximo del fusible
  #  es el de la ficha Siemens 5SV3 equivalente (63 A en 2P 25 A, 80 A en 4P 40 A).
  - ref: DIF-2P-25A-30MA-A
    name: Diferencial 2P 25 A 30 mA clase A
    description: Interruptor diferencial (RCCB, sin protección de sobrecorriente) de 2 polos, 25 A, 30 mA, clase A (IEC 61008-1), riel DIN; protección de personas contra contactos. Se compone con un ITM. Verificar con el proveedor.
    builder: interruptor_modular
    params: {width: 36, depth: 75, height: 90, tipo: diferencial}
    zonas: &zonas_dif {cuerpo: plastico_ral7035, bornes: niquelado, palanca: plastico_negro, placa: {acabado: plastico_blanco, fijo: true}, clip: plastico_negro, prueba: plastico_gris}
    weight: 0.2
    specs: {In_A: 25, IDn_mA: 30, clase_residual: A, polos: 2, modulos_DIN: 2, frecuencia_ficha: "50/60 Hz", linea_referencia: "orden de Schneider Acti9 iID / ABB F200 / Siemens 5SV3 (2P, clase A)", cotas_verificadas: false, cost: 45}
    electrico: &diferencial_2p
      funcion: F
      simbolo: diferencial_2p
      montaje: din
      bornes:
        - {id: "1", rol: potencia, lado: linea}
        - {id: "2", rol: potencia, lado: carga}
        - {id: N1, rol: potencia, lado: linea}
        - {id: N2, rol: potencia, lado: carga}
      caminos:
        - {de: "1", a: "2", tipo: proteccion}
        - {de: N1, a: N2, tipo: proteccion}
      modelo: {tipo: diferencial, In_A: 25, IDn_mA: 30, clase_residual: A, polos: 2}
