category: mandos
# ELÉCTRICO (plan V8.1 D5): numeración de contactos de uso normalizado (dígito de secuencia +
# función: 11-12 NC, 13-14 NA; el segundo contacto, 21-22). La seta es `parada_emergencia`
# (regla del ERC). En la botonera, cada
# pulsador es su propio actuador (`grupo`); el potenciómetro (P1-P3 extremos, P2 cursor) se
# alimenta del +10 V del variador. SENTIDO (V8.3 F4–F5): la posición que «girar» le da (0–1) es la
# fracción de P1 al cursor, así que 1 = cursor junto a P3: cablea P3 al +10 V y P1 al GND para que
# «a fondo» sea la consigna máxima. El bloque no toca la geometría (sin bump de GEOM_CACHE_EPOCH).
# `electrico.modelo` (plan V8.3 D7): la seta queda RETENIDA al presionarla y sólo vuelve al
# liberarla por giro (ISO 13850: desenclavar la seta no rearranca la máquina por sí solo); los
# pulsadores de la botonera vuelven por resorte, uno por actuador (`actuadores` = sus `grupo`).
# GEOMETRÍA de la seta (plan seta-de-emergencia, D4–D5): builder `seta_emergencia` por zonas
# (marco y anclas en `library/builders_mandos.py`). Es UNA pieza: un sólido, una línea de BOM y
# su masa de ficha; `zonas` dice qué acabado lleva cada parte y `fijo` marca los colores de la
# norma (seta ROJA sobre fondo AMARILLO, ISO 13850 §4.3.6, IEC 60204-1 §10.7.3) que el color
# de la pieza no repinta. Cotas típicas, sin verificar. Las dos setas llevan la misma ficha;
# la de caja cambia sólo `montaje` (va en la máquina, no en la puerta del tablero).
# cost = USD REFERENCIAL (mercado de Lima, aprox., como el catálogo eléctrico de V8.1): actualizar
# con el proveedor para cotizar en firme. Una ref eléctrica sin `cost` sale «sin precio» en la
# cotización (no se estima por peso: V8.1 F4).
components:
  - ref: ESTOP-40
    name: Paro de emergencia Ø40
    description: >-
      Pulsador de emergencia tipo hongo Ø40 mm para la puerta del tablero (agujero Ø22,5),
      retención por giro, contacto NC de apertura positiva (ISO 13850), con anillo de leyenda
      amarillo Ø60 «PARADA DE EMERGENCIA». Verificar con el proveedor.
    builder: seta_emergencia
    params: {d_seta: 40, montaje: puerta, d_leyenda: 60, panel_mm: 2}
    tablero: {puerta: {delante_mm: 33, detras_mm: 44}}
    weight: 0.15
    specs:
      tipo: "hongo Ø40"
      contacto: "NC apertura positiva"
      norma: "ISO 13850"
      agujero: "Ø22,5"
      leyenda: "Ø60 amarilla"
      linea_referencia: "orden de Schneider Harmony XB5AS8445 + ZBY9140 / Siemens SIRIUS ACT 3SU1"
      cotas_verificadas: false
      cost: 30
    zonas:
      seta: {acabado: plastico_rojo_seguridad, fijo: true}
      collar: {acabado: plastico_negro}
      leyenda: {acabado: plastico_amarillo_seguridad, fijo: true}
      cuerpo: {acabado: plastico_gris}
    electrico: &ficha_seta
      funcion: S
      simbolo: seta_emergencia
      montaje: puerta
      parada_emergencia: true
      bornes:
        - {id: "11", rol: contacto}
        - {id: "12", rol: contacto}
      caminos: [{de: "11", a: "12", tipo: NC, accion: mano}]
      modelo: {tipo: seta, retorno: retenido}
      datos: &datos_seta {T_max_C: 70}
      fuente: &fuente_seta "Schneider Electric, fichas de producto Harmony XB5AS8445 y XB5AS8442 (schneider-electric.cn, 2026-10-24): temperatura de funcionamiento −40…70 °C"
  - ref: ESTOP-40-CAJA
    name: Paro de emergencia Ø40 en caja
    description: >-
      Pulsador de emergencia tipo hongo Ø40 mm en caja de superficie amarilla 72×72 para montar
      en la máquina (2 agujeros M5, prensaestopa M20 abajo), retención por giro, contacto NC de
      apertura positiva (ISO 13850), con anillo de leyenda amarillo Ø60. Verificar con el
      proveedor.
    builder: seta_emergencia
    params: {d_seta: 40, montaje: caja, d_leyenda: 60, alto_caja: 55, lado_caja: 72}
    weight: 0.3
    specs:
      tipo: "hongo Ø40"
      contacto: "NC apertura positiva"
      norma: "ISO 13850"
      caja: "72×72×55 amarilla, IP65"
      fijacion: "2 × M5"
      prensaestopa: M20
      leyenda: "Ø60 amarilla"
      linea_referencia: "orden de Schneider Harmony XAPJ / XALK + XB5AS8445 / Siemens SIRIUS ACT 3SU1801"
      cotas_verificadas: false
      cost: 45
    zonas:
      seta: {acabado: plastico_rojo_seguridad, fijo: true}
      collar: {acabado: plastico_negro}
      leyenda: {acabado: plastico_amarillo_seguridad, fijo: true}
      caja: {acabado: plastico_amarillo_seguridad}
      prensaestopa: {acabado: plastico_negro}
    electrico:
      <<: *ficha_seta
      montaje: campo
  # DOS CANALES (plan mandos-de-seguridad D1): la misma seta con un segundo bloque NC de apertura
  # positiva (21-22) para la categoría 3 de ISO 13849-1 (cada canal con su contacto). Mismo
  # builder con `bloques: 2`: en la puerta el bloque apilado alarga el portacontactos 14 mm
  # (detras_mm 44 → 58); en la caja van adentro, que sube a 69 de alto. Mismo modelo `seta`: los
  # dos NC siguen a la mano y cada uno es una rama propia de la red (un `pegado` pega UNO).
  # Cotas y costo del orden de la línea, sin verificar.
  - ref: ESTOP-40-2NC
    name: Paro de emergencia Ø40 2NC
    description: >-
      Pulsador de emergencia tipo hongo Ø40 mm para la puerta del tablero (agujero Ø22,5),
      retención por giro, DOS contactos NC de apertura positiva (11-12 y 21-22, uno por canal:
      ISO 13850, ISO 13849-1 categoría 3), con anillo de leyenda amarillo Ø60 «PARADA DE
      EMERGENCIA». Verificar con el proveedor.
    builder: seta_emergencia
    params: {d_seta: 40, montaje: puerta, d_leyenda: 60, panel_mm: 2, bloques: 2}
    tablero: {puerta: {delante_mm: 33, detras_mm: 58}}
    weight: 0.17
    specs:
      tipo: "hongo Ø40"
      contacto: "2NC apertura positiva"
      norma: "ISO 13850"
      agujero: "Ø22,5"
      leyenda: "Ø60 amarilla"
      linea_referencia: "orden de Schneider Harmony XB5AS8442 + ZBY9140 / Siemens SIRIUS ACT 3SU1 con dos bloques 1NC"
      cotas_verificadas: false
      cost: 36
    zonas:
      seta: {acabado: plastico_rojo_seguridad, fijo: true}
      collar: {acabado: plastico_negro}
      leyenda: {acabado: plastico_amarillo_seguridad, fijo: true}
      cuerpo: {acabado: plastico_gris}
    electrico: &ficha_seta_2nc
      funcion: S
      simbolo: seta_emergencia
      montaje: puerta
      parada_emergencia: true
      bornes:
        - {id: "11", rol: contacto}
        - {id: "12", rol: contacto}
        - {id: "21", rol: contacto}
        - {id: "22", rol: contacto}
      caminos:
        - {de: "11", a: "12", tipo: NC, accion: mano}
        - {de: "21", a: "22", tipo: NC, accion: mano}
      modelo: {tipo: seta, retorno: retenido}
      datos: *datos_seta
      fuente: *fuente_seta
  - ref: ESTOP-40-CAJA-2NC
    name: Paro de emergencia Ø40 2NC en caja
    description: >-
      Pulsador de emergencia tipo hongo Ø40 mm en caja de superficie amarilla 72×72 para montar
      en la máquina (2 agujeros M5, prensaestopa M20 abajo), retención por giro, DOS contactos NC
      de apertura positiva (11-12 y 21-22, uno por canal: ISO 13850, ISO 13849-1 categoría 3),
      con anillo de leyenda amarillo Ø60. Verificar con el proveedor.
    builder: seta_emergencia
    params: {d_seta: 40, montaje: caja, d_leyenda: 60, alto_caja: 69, lado_caja: 72, bloques: 2}
    weight: 0.33
    specs:
      tipo: "hongo Ø40"
      contacto: "2NC apertura positiva"
      norma: "ISO 13850"
      caja: "72×72×69 amarilla, IP65"
      fijacion: "2 × M5"
      prensaestopa: M20
      leyenda: "Ø60 amarilla"
      linea_referencia: "orden de Schneider Harmony XAPJ / XALK + XB5AS8442 / Siemens SIRIUS ACT 3SU1801 con dos bloques 1NC"
      cotas_verificadas: false
      cost: 52
    zonas:
      seta: {acabado: plastico_rojo_seguridad, fijo: true}
      collar: {acabado: plastico_negro}
      leyenda: {acabado: plastico_amarillo_seguridad, fijo: true}
      caja: {acabado: plastico_amarillo_seguridad}
      prensaestopa: {acabado: plastico_negro}
    electrico:
      <<: *ficha_seta_2nc
      montaje: campo
  # RESGUARDO (plan mandos-de-seguridad D2): interruptor de seguridad con ACTUADOR SEPARADO
  # (ISO 14119 tipo 2). El cuerpo se atornilla a la estructura y la lengüeta (ref aparte, como
  # se compra) a la hoja del resguardo. 2 NC de apertura positiva (IEC 60947-5-1 Anexo K) que
  # están CERRADOS con la lengüeta adentro: los mueve el actuador «abierto» (el interruptor se
  # acciona al sacar la lengüeta), cada uno una rama propia. Modelo `resguardo`: `abrir`/`cerrar`,
  # arranca cerrado; falla `trabado`. Builder `interruptor_resguardo` (marco en
  # `library/builders_mandos.py`). Cotas y costo del orden de la línea, sin verificar.
  - ref: RESG-2NC
    name: Interruptor de resguardo 2NC
    description: >-
      Interruptor de seguridad para resguardo móvil con actuador separado (ISO 14119 tipo 2),
      2 contactos NC de apertura positiva (11-12 y 21-22, uno por canal), cerrados con la lengüeta
      adentro; caja de plástico 30×92×30 con 2 agujeros M5 y prensaestopa M20. La lengüeta va
      aparte (RESG-LENGUETA). Verificar con el proveedor.
    builder: interruptor_resguardo
    params: {parte: cuerpo}
    weight: 0.12
    specs:
      tipo: "ISO 14119 tipo 2, actuador separado"
      contacto: "2NC apertura positiva"
      norma: "ISO 14119 / IEC 60947-5-1 Anexo K"
      fijacion: "2 × M5"
      prensaestopa: M20
      actuador: RESG-LENGUETA
      linea_referencia: "orden de Schneider Preventa XCSPA592 / Siemens SIRIUS 3SE5112 con actuador aparte"
      cotas_verificadas: false
      cost: 40
    electrico:
      funcion: B
      simbolo: interruptor_resguardo
      montaje: campo
      bornes:
        - {id: "11", rol: contacto}
        - {id: "12", rol: contacto}
        - {id: "21", rol: contacto}
        - {id: "22", rol: contacto}
      caminos:
        - {de: "11", a: "12", tipo: NC, accion: mano, grupo: abierto}
        - {de: "21", a: "22", tipo: NC, accion: mano, grupo: abierto}
      modelo: {tipo: resguardo, actuador: separado}
  - ref: RESG-LENGUETA
    name: Lengüeta de interruptor de resguardo
    description: >-
      Actuador recto (lengüeta) del interruptor de resguardo RESG-2NC, para atornillar a la hoja
      del resguardo con 2 tornillos M4. Verificar con el proveedor.
    builder: interruptor_resguardo
    params: {parte: lengueta}
    weight: 0.02
    specs:
      para: RESG-2NC
      fijacion: "2 × M4"
      linea_referencia: "orden de Schneider Preventa XCSZ11 / Siemens SIRIUS 3SE5000-0AV01"
      cotas_verificadas: false
      cost: 10
  - ref: BOTONERA-2
    name: Botonera marcha/paro
    description: Botonera de 2 pulsadores Ø22 (marcha verde / paro rojo) con potenciómetro de velocidad.
    builder: box
    params: {width: 80, depth: 60, height: 120}
    weight: 0.3
    specs: {pulsadores: 2, diametro: "Ø22", incluye: "potenciómetro 10kOhm", linea_referencia: "orden de una caja de 2 pulsadores Schneider Harmony XALD + potenciómetro 10 kΩ", cotas_verificadas: false, cost: 35}
    electrico:
      funcion: S
      simbolo: botonera
      montaje: campo
      bornes:
        - {id: "13", rol: contacto}
        - {id: "14", rol: contacto}
        - {id: "21", rol: contacto}
        - {id: "22", rol: contacto}
        - {id: P1, rol: señal}
        - {id: P2, rol: señal}
        - {id: P3, rol: señal}
      caminos:
        - {de: "13", a: "14", tipo: NA, accion: mano, grupo: marcha}
        - {de: "21", a: "22", tipo: NC, accion: mano, grupo: paro}
      cargas: [{bornes: [P1, P3], tension: "0-10 VDC", tipo: otra, obligatoria: false}]
      modelo: {tipo: pulsador, retorno: resorte, actuadores: [marcha, paro], potenciometro_ohm: 10000}
