category: garruchas
# GARRUCHAS INDUSTRIALES DE PLACA (giratoria, giratoria con freno total y fija), con ficha real.
# Plan: docs/plans/garruchas-catalogo.md (D1-D9). Builder: caster (library/builders_rodaje.py).
#
# MARCO DEL BUILDER: origen = centro de la cara SUPERIOR de la placa (la que se atornilla a la
# máquina), Z arriba; placa placa_l (X) x placa_w (Y), z en [-placa_t, 0]; 4 agujeros en
# (+-agujeros_x/2, +-agujeros_y/2) (ranuras a lo largo de Y si agujeros_y_min != agujeros_y_max);
# eje de la rueda paralelo a Y; giratoria/freno total: rueda DETRÁS, en x = -avance; fija: bajo el
# centro; apoyo al piso en z = -altura. -> position de insert_component = centro de la cara
# INFERIOR de la placa base de la pata. Ancla "placa" (origen, +Z).
#
# QUÉ ES REAL Y QUÉ NO. Real (de la ficha): Ø y ancho de rueda, altura, avance (Blickle), placa
# largo x ancho, patrón de agujeros, carga. REPRESENTATIVO en el 3D: pista de giro, horquilla, eje
# y pedal (escalados del espacio libre altura - rueda_d - placa_t). Cada variante lo declara en
# `no_publicado` (lo leen el agente, la BOM y quien cotiza). Cuando se cotice en firme, los
# estimados se reemplazan y se borra su mención.
#
# Sin `cost` (D4): no hay precio publicado del MISMO modelo; el costeo cae a su estimación por
# peso y la declara. Precios CERCANOS de referencia para cotizar:
#   - Barron Equipment, Blickle LH-ALTH 150K-16 (otra placa): USD 198.29
#     https://www.barroneq.com/product/6-inch-swivel-caster-with-polyurethane-elastomer-blickle-extrathane-wheel/
#   - Lima, 2026-10-06, genérica SERRATURE 150 mm PU 350 kg: S/ 89.60 giratoria, S/ 115.26 con
#     freno, S/ 82.17 fija. Sodimac https://www.sodimac.com.pe/sodimac-pe/articulo/121751634/x
#     y Promart https://www.promart.pe/garrucha-freno-naranja-150mm-carga-350kg-1001371391/p
#
# ---------------------------------------------------------------------------------------------
# BLICKLE LH-ALTH (giratoria) / LH-ALTH-...-ST (giratoria con freno total "stop-top": bloquea
# rueda y giro) / BH-ALTH (fija). Banda Blickle Extrathane (poliuretano 92 Shore A) sobre núcleo
# de aluminio inyectado, rodamiento de bolas, horquilla de chapa de acero zincada. Fichas
# https://www.blickle.us/en-us/product/<slug>:
#   LH-ALTH-100K-3 lh-alth-100k-3-617001       LH-ALTH-100K-3-ST lh-alth-100k-3-st-677245
#   BH-ALTH-100K-3 bh-alth-100k-3-752603       LH-ALTH-125K-3    lh-alth-125k-3-265918
#   LH-ALTH-125K-3-ST lh-alth-125k-3-st-279000 BH-ALTH-125K-3    bh-alth-125k-3-266064
#   LH-ALTH-150K   lh-alth-150k-295279         LH-ALTH-150K-ST   lh-alth-150k-st-337840
#   BH-ALTH-150K   bh-alth-150k-308288         LH-ALTH-200K      lh-alth-200k-265942
#   LH-ALTH-200K-ST lh-alth-200k-st-283978     BH-ALTH-200K      bh-alth-200k-266080
# Publicado: placa 140 x 110 con agujeros 105 x 75-80 (ranurados) Ø11 en los 4 Ø y las 3
# variantes; altura, avance, carga a 4 km/h y estática, peso. NO publicado: espesor de placa
# (placa_t 5 REPRESENTATIVO) y radio de giro (no se escribe).
#
# COLSON COLOMBIA (ex-IMSA) serie 45 (giratoria) / 44 (fija), PU, horquilla de acero galvanizado.
# Se vende en Lima: Ruedas y Garruchas Industriales SAC, Jr. Julio C. Tello 1121, Lince,
# https://ruedasygarruchas.com.pe/ (nomenclatura de la tienda «6X2 PU 45 A»). Banda poliuretano
# 90+-5 Shore A sobre rin de polipropileno, balinera de precisión. Fichas del fabricante
# archivadas en Wayback (2023-10-21; el sitio vivo da 403):
#   6-PR-045-A  https://web.archive.org/web/20231021173044/https://www.colsoncolombia.com/wp-content/uploads/fichas-tecnicas/rodachines/7019670-ROD-6-PR-045-A-F00BP-12-PL-NE-TZ.pdf
#   6-PR-044-A  https://web.archive.org/web/20231021173121/https://www.colsoncolombia.com/wp-content/uploads/fichas-tecnicas/rodachines/7019540-ROD-6-PR-044-A-F00BP-12-PL-NE-TZ.pdf
#   6-NYLON-045-A-FTR (con freno) https://web.archive.org/web/20231021173055/https://www.colsoncolombia.com/wp-content/uploads/fichas-tecnicas/rodachines/7019780-ROD-6-NYLON-045-A-FTRBN-12-PL-BL-TZ.pdf
#   6-PU-044-A  https://web.archive.org/web/20231021173042/https://www.colsoncolombia.com/wp-content/uploads/fichas-tecnicas/rodachines/7018060.pdf
#   5-PU-044-A  https://web.archive.org/web/20231021173124/https://www.colsoncolombia.com/wp-content/uploads/fichas-tecnicas/rodachines/7018040-ROD-5-PU-044-A-F00BP-12-PL-MR-TZ.pdf
#   5-PB-045-A  .../rodachines/7019910-ROD-5-PB-045-A-F00BP-12-PL-NE-TZ.pdf  (altura y radio 5" giratoria)
#   4-PB-045-A  .../rodachines/7010751.pdf    4-AT-044-A .../rodachines/7010912.pdf
#   8-NYLON-044-A .../rodachines/7018120-ROD-8-NYLON-044-A-F00BP-12-PL-BL-TZ.pdf
#   8-NEUMATICA-045-A .../rodachines/7091030-ROD-8-NEUMATICA-045-A-F00BT-12-RE-NE-TZ.pdf
#   Listado dic-2022 (series 44/45, nomenclatura):
#   https://web.archive.org/web/20230915222452/https://www.colsoncolombia.com/wp-content/uploads/fichas-tecnicas/catalogo/Listado-de-productos-Colson-Colombia-Diciembre-2022.pdf
# Publicado (pulgadas -> mm x 25.4, a 0.1 mm), igual en 4"/5"/6"/8": placa 5" x 4" = 127.0 x 101.6
# (5" a lo largo de la rodadura); agujeros 3 3/4" x 3" = 95.3 x 76.2 (redondos); eje 1/2".
# Alturas: 4" 5 13/16 (gir y fija) · 5" 6 11/16 gir, 6 9/16 fija · 6" 7 11/16 gir, 7 5/8 fija ·
# 8" 9 9/16 fija (y la neumática giratoria). Radio de giro: 3 11/16 · 4 3/16 · 4 7/8 · 6 11/16
# (8": de la neumática). Banda PU 1 3/4" (5" y 6"). Carga PU: 200 · 250 · 400 · 400 kg.
# DERIVADO / ESTIMADO / REPRESENTATIVO (cada variante lo dice en `no_publicado`):
#   - agujero_d 11 REPRESENTATIVO (perno 3/8"); placa_t 4 REPRESENTATIVO.
#   - avance DERIVADO del radio de giro R publicado: e = sqrt(R^2 - (b/2)^2) - D/2
#     (4" 40.2 · 5" 40.5 · 6" 45.6 · 8" 66.8, este último con el radio de la neumática).
#   - rueda_b 44.5 (1 3/4") publicado para 5" y 6"; 4" y 8" por analogía (la tienda los llama
#     «X2», la misma clase de ancho).
#   - altura 8" giratoria = la de la fija 044 publicada (= la neumática 045).
#   - altura con freno total = la de la giratoria: la ficha 6" nylon 045 con freno la iguala.
#   - weight ESTIMADO por analogía con Blickle de igual Ø y clase.
#   - freno total: las fichas de la serie 45 lo codifican FTR (6-NYLON-045-A-FTR); el listado
#     usa FTO en otras series. El emparejamiento código-etiqueta no quedó verificado: por eso la
#     ref lleva el sufijo -FT (D2).
#   - la tienda de Lima anuncia la 4X2 PU 45 A con freno a 350 kg; la ficha dice 200: va 200.
