      - {ref: "TORNILLO-MADERA-PZ-3.5", d: 3.5, head_d: 7.0, largo_ref: 35, punta: "PZ1", f_ax_k_mpa: 14.0, cost: 0.02, largos_mm: [16, 20, 25, 30, 35, 40, 45, 50, 55]}
