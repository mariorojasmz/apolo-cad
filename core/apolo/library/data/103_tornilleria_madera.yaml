      - {ref: "TORNILLO-MADERA-PZ-4.5", d: 4.5, head_d: 9.0, largo_ref: 50, punta: "PZ2", f_ax_k_mpa: 14.0, cost: 0.03, largos_mm: [20, 25, 30, 35, 40, 45, 50, 55, 60, 70, 80]}
