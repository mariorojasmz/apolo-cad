category: alimentacion_electrica
# Catálogo eléctrico de la faja piloto (plan V8.1 D6): red de suministro y fuentes de 24 VDC.
#
# Convención de las refs eléctricas 120_–125_ (y de los bloques `electrico:` agregados a refs
# existentes):
#  - ref GENÉRICA por rol, sin marca; `specs.linea_referencia` nombra la línea del fabricante
#    cuyos datos eléctricos se siguen («orden de …»: valores del mismo orden, no la ficha);
#  - `cotas_verificadas: false`: la envolvente (builder `box`) es aproximada; los aparatos
#    modulares usan el módulo DIN de 18 mm; verificar con el proveedor antes de armar el tablero;
#  - cost = USD REFERENCIAL (mercado de Lima, aprox.); perdidas_W = estimación a la corriente
#    nominal, del orden de las fichas (sirve al calentamiento del tablero de V8.5);
#  - `electrico.funcion` = clase de una letra de IEC 81346-2: G inicia un flujo de energía (la
#    red), T convierte energía (fuente conmutada, variador), Q conmuta potencia (seccionador,
#    guardamotor, contactor), F protege (ITM, relé térmico, fusible), K procesa señales (relé,
#    PLC), S mando manual, P señalización, B sensor, M motor, X borne, W conductor, U soporte.
#    La letra sólo es el prefijo por defecto de la designación (-Q1, -K1); la designación la
#    elige quien declara el tablero.
#  - `electrico.modelo` (plan V8.3 D7) = los parámetros con que la co-simulación EMULA la ref:
#    `tipo` elige el modelo (`core/apolo/cosim/modelos`, uno por tipo) y cada cifra dice su norma
#    o «criterio de diseño» en el comentario de su familia. Un rango [mín, máx] de un parámetro
#    que fija el instalador (el Ir de un guardamotor, la relación de un NMRV) es un AJUSTE
#    obligatorio de `add_device`; un rango de ficha (los tiempos de un contactor) se toma en su
#    punto medio y se declara. Un parámetro que falta es un error accionable al simular, nunca
#    un valor inventado. Agregar claves al `modelo` no toca la geometría (sin bump de
#    GEOM_CACHE_EPOCH).
#  - `electrico.datos`, `fuente` y `a_confirmar` (plan datos-de-corte-y-acometida, D1–D5): los
#    datos de ficha que lee quien VERIFICA (poder de corte, `T_max_C`), FUERA de `modelo` (no
#    entran a la firma del documento ni son ajustes). Al cargar se exige la COMPLETITUD
#    (`library/electrico/ficha_datos.REQUERIDOS`, más `T_max_C` en toda ref de tablero): cada dato
#    está, con su documento en `fuente`, o se nombra en `a_confirmar` SIN valor. `a_confirmar`
#    también nombra una clave de `modelo` cuyo valor es supuesto (la Icc de una red).
#    `cotas_verificadas` sigue hablando sólo de la envolvente.
#
# Red (`tipo: red`, D15): `sistema` = 1F+N | 2F | 3F | 3F+N (coherente con su fuente); la
# impedancia en bornes sale de Icc: Zk = Un/(√3·Icc) por fase (IEC 60909-0 con c = 1: la tensión
# nominal, no el peor caso de cortocircuito), repartida en R y X con X_R = 1,5 (criterio de
# diseño: red de BT alimentada por un transformador de distribución más su acometida).
#
# La red de 220 V SIN neutro de Lima (3F y 2F) es IT (plan datos-de-corte-y-acometida § «Red de
# 220 V de Lima: IT»): la fuente no tiene punto a tierra y las masas van a un electrodo propio. Sus
# `datos` son la norma DEL LUGAR (`ficha_datos.DATOS_OPCIONALES` de `red`), fuera de `modelo`: la RA
# máxima de la puesta a tierra, el diferencial que exige el CNE y las tolerancias de tensión y
# frecuencia en el punto de entrega. Textos leídos el 2026-10-26 en los PDF oficiales (gob.pe,
# osinergmin.gob.pe): CNE-Utilización 2006 (RM 037-2006-MEM/DM), su modificación RM 175-2008-MEM/DM,
# CNE-Suministro 2011 (RM 214-2011-MEM/DM) y la NTCSE (DS 020-97-EM).
#
# Fuente 24 VDC (`tipo: fuente`): limita a corriente CONSTANTE y se recupera sola (la línea de
# referencia); I_limite_pct = 130 (criterio de diseño: dentro de la banda de sobrecarga de
# 105–160 % de su ficha); t_retencion_ms = 20 a plena carga (orden de la ficha; IEC 61000-4-11
# prueba huecos de ese orden); U_entrada_min_V = 85 (entrada universal 100–240 VAC con su
# tolerancia de ficha, 85–264 VAC).
components:
  - ref: RED-3F-220V-60HZ
    name: Red trifásica 220 V 60 Hz sin neutro
    description: Punto de suministro de la red trifásica de 220 V 60 Hz SIN neutro, la de uso común en Lima (el mando va a 220 V entre fases o a 24 VDC desde una fuente). Esquema de tierra IT (sistema aislado de 220 V del CNE; las masas a un electrodo propio de 25 Ω como máximo). La corriente de cortocircuito presunta es SUPUESTA (10 kA en bornes) y DECLARADA, no medida - verificar con la distribuidora. No es un artículo de compra.
    builder: box
    params: {width: 120, depth: 60, height: 120}
    weight: 0.0
    specs: {tension: "220V 3F 60Hz", neutro: false, icc_kA: 10, icc_supuesta: true, linea_referencia: "red de distribución de baja tensión de Lima (220 V entre fases, sin neutro)", cotas_verificadas: false, suministro: true, cost: 0}
    electrico:
      funcion: G
      simbolo: red_3f
      montaje: campo
      bornes:
        - {id: L1, rol: potencia}
        - {id: L2, rol: potencia}
        - {id: L3, rol: potencia}
        - {id: PE, rol: tierra}
      fuentes:
        - {polos: {L1: L1, L2: L2, L3: L3, PE: PE}, tension: "220 VAC 3F 60 Hz"}
      modelo: {tipo: red, sistema: 3F, U_V: 220, f_Hz: 60, Icc_kA: 10, Icc_supuesta: true, neutro: false, esquema: IT, X_R: 1.5}
      datos: &datos_lima {RA_max_ohm: 25, diferencial_max_mA: 30, tolerancia_U_pct: 5, tolerancia_f_pct: 0.6}
      a_confirmar: [Icc_kA, X_R]
      fuente: &fuente_lima "esquema IT, clasificación DEDUCIDA de las definiciones (ninguna regla lo nombra así): CNE-Suministro 2011, Regla 017.B y su Nota 1 («sistemas con neutro no puesto a tierra») y la definición de conductor neutro (delta no puesto a tierra); CNE-Utilización 2006, Regla 020-500(2) («trifásico de 220 V- 3 hilos (para los sistemas aislados de 220 V)») y Anexo A-3 (I = partes activas aisladas de tierra; T = masas unidas directamente a tierra; esquema IT, masas a una tierra independiente). 60 Hz: CNE-U Regla 020-502. RA_max_ohm: CNE-U Regla 060-712 «Resistencia de Electrodos» («no debe ser mayor a 25 Ω»). diferencial_max_mA: CNE-U Regla 020-132 en el texto de la RM 175-2008-MEM/DM («Toda instalación eléctrica debe estar protegida con interruptor diferencial», de no más de 30 mA donde usan el equipo personas no calificadas; no dice en qué tablero va). tolerancia_U_pct: NTCSE (DS 020-97-EM) numeral 5.1.2 (± 5,0 % en el punto de entrega; ± 7,5 % en redes urbano-rurales y rurales) y CNE-S Regla 017.D. tolerancia_f_pct: NTCSE numeral 5.2.3 (variaciones sostenidas ± 0,6 %). Leídos el 2026-10-26 en cdn.www.gob.pe y osinergmin.gob.pe. Icc presunta SUPUESTA en bornes y X/R = 1,5: criterio de diseño (cabecera de este archivo); las distribuidoras de Lima no los publican: vienen en la factibilidad de suministro de cada obra"
      nota: "Red IT: la tensión fase-tierra no la fija la red (la fuente no tiene punto a tierra). Con una primera falla a masa las fases sanas quedan a la tensión entre fases (Schneider Electric, Electrical installation guide 2018, PDF 190)."
  - ref: RED-3F-380-220V-60HZ
    name: Red trifásica 380/220 V 60 Hz con neutro
    description: Punto de suministro de una red trifásica 380/220 V 60 Hz CON neutro (redes industriales; esquema TN supuesto y declarado). Corriente de cortocircuito presunta SUPUESTA de 10 kA en bornes, declarada - verificar con la distribuidora. No es un artículo de compra.
    builder: box
    params: {width: 120, depth: 60, height: 120}
    weight: 0.0
    specs: {tension: "380/220V 3F+N 60Hz", neutro: true, icc_kA: 10, icc_supuesta: true, linea_referencia: "red de distribución de baja tensión 380/220 V con neutro (esquema TN supuesto)", cotas_verificadas: false, suministro: true, cost: 0}
    electrico:
      funcion: G
      simbolo: red_3f_n
      montaje: campo
      bornes:
        - {id: L1, rol: potencia}
        - {id: L2, rol: potencia}
        - {id: L3, rol: potencia}
        - {id: N, rol: potencia}
        - {id: PE, rol: tierra}
      fuentes:
        - {polos: {L1: L1, L2: L2, L3: L3, N: N, PE: PE}, tension: "380/220 VAC 3F+N 60 Hz"}
      modelo: {tipo: red, sistema: 3F+N, U_V: 380, U_fase_V: 220, f_Hz: 60, Icc_kA: 10, Icc_supuesta: true, neutro: true, esquema: TN, X_R: 1.5}
      a_confirmar: [Icc_kA, X_R, esquema]
      fuente: &fuente_red "criterio de diseño: Icc presunta SUPUESTA en bornes y X/R = 1,5 de una red de BT alimentada por un transformador de distribución (cabecera de este archivo); el esquema de tierra (TN supuesto, o sin declarar) lo confirma la distribuidora"
  - ref: RED-2F-220V-60HZ
    name: Red de dos fases 220 V 60 Hz
    description: Punto de suministro MONOFÁSICO de 220 V 60 Hz tomado entre DOS FASES de la red trifásica de 220 V sin neutro (la monofásica habitual en Lima; los dos conductores son fases). Esquema de tierra IT, como la red trifásica de la que sale. Corriente de cortocircuito presunta SUPUESTA de 10 kA en bornes, declarada - verificar con la distribuidora. No es un artículo de compra.
    builder: box
    params: {width: 120, depth: 60, height: 120}
    weight: 0.0
    specs: {tension: "220V 2F 60Hz", neutro: false, icc_kA: 10, icc_supuesta: true, linea_referencia: "acometida monofásica de dos fases de la red de 220 V de Lima (sin neutro)", cotas_verificadas: false, suministro: true, cost: 0}
    electrico:
      funcion: G
      simbolo: red_2f
      montaje: campo
      bornes:
        - {id: L1, rol: potencia}
        - {id: L2, rol: potencia}
        - {id: PE, rol: tierra}
      fuentes:
        - {polos: {L1: L1, L2: L2, PE: PE}, tension: "220 VAC 2F 60 Hz"}
      modelo: {tipo: red, sistema: 2F, U_V: 220, f_Hz: 60, Icc_kA: 10, Icc_supuesta: true, neutro: false, esquema: IT, X_R: 1.5}
      datos: *datos_lima
      a_confirmar: [Icc_kA, X_R]
      fuente: *fuente_lima
      nota: "Los dos conductores son FASES: el polo de un ITM va en cada uno (2P), no hay neutro que dejar sin proteger. Es la misma red IT de 220 V: dos de sus tres fases."
  - ref: RED-1F-220V-60HZ
    name: Red monofásica 220 V 60 Hz fase-neutro
    description: Punto de suministro MONOFÁSICO de 220 V 60 Hz fase-neutro, tomado de una red 380/220 V con neutro (esquema TN supuesto y declarado). Corriente de cortocircuito presunta SUPUESTA de 6 kA en bornes (la de un ITM residencial), declarada - verificar con la distribuidora. No es un artículo de compra.
    builder: box
    params: {width: 120, depth: 60, height: 120}
    weight: 0.0
    specs: {tension: "220V 1F+N 60Hz", neutro: true, icc_kA: 6, icc_supuesta: true, linea_referencia: "acometida monofásica fase-neutro de una red 380/220 V (esquema TN supuesto)", cotas_verificadas: false, suministro: true, cost: 0}
    electrico:
      funcion: G
      simbolo: red_1f_n
      montaje: campo
      bornes:
        - {id: L, rol: potencia}
        - {id: N, rol: potencia}
        - {id: PE, rol: tierra}
      fuentes:
        - {polos: {L: L, N: N, PE: PE}, tension: "220 VAC 60 Hz"}
      modelo: {tipo: red, sistema: 1F+N, U_V: 220, f_Hz: 60, Icc_kA: 6, Icc_supuesta: true, neutro: true, esquema: TN, X_R: 1.5}
      a_confirmar: [Icc_kA, X_R, esquema]
      fuente: *fuente_red
  # ARMADO (plan V8.5 F2, D4): la cara de cada borne en la caja (la fuente cambia de una línea a
  # otra: estas refs llevan la suya). Entrada abajo, salida arriba: orden de Mean Well EDR/HDR,
  # SIN verificar con la ficha de la línea que se compre.
  - ref: FUENTE-24VDC-2.5A
    name: Fuente 24 VDC 2,5 A (riel DIN)
    description: Fuente conmutada de riel DIN, entrada 100-240 VAC (en Lima, entre dos fases de 220 V), salida 24 VDC 2,5 A (60 W) para el mando. Verificar con el proveedor.
    builder: fuente_riel
    params: {width: 54, depth: 57, height: 90}
    zonas: &zonas_fuente {cuerpo: plastico_ral7035, bornes: niquelado, led: {acabado: plastico_verde, fijo: true}, ajuste: {acabado: plastico_azul, fijo: true}, placa: {acabado: plastico_blanco, fijo: true}, clip: plastico_negro}
    tablero: {bornes: &fuente_caras {abajo: [L, N, PE], arriba: [L+, M], fuente: "orden de Mean Well EDR-120-24 / HDR-60-24 (entrada abajo, salida arriba): verificar con la ficha"}}
    weight: 0.2
    specs: {tension_entrada: "100-240 VAC", tension_salida: "24 VDC", corriente_A: 2.5, potencia_W: 60, modulos_DIN: 3, linea_referencia: "orden de Mean Well HDR-60-24 / Phoenix Contact UNO POWER 24 V 2,5 A", cotas_verificadas: false, cost: 35}
    electrico: &fuente_24
      funcion: T
      simbolo: fuente_ac_dc
      montaje: din
      perdidas_W: 8
      bornes:
        - {id: L, rol: potencia, lado: linea}
        - {id: N, rol: potencia, lado: linea}
        - {id: PE, rol: tierra}
        - {id: L+, rol: mando, lado: carga}
        - {id: M, rol: mando, lado: carga}
      cargas:
        - {bornes: [L, N], tension: "100-240 VAC", tipo: alimentacion}
      fuentes:
        - {polos: {L+: "+", M: "-"}, tension: "24 VDC"}
      modelo: {tipo: fuente, U_salida_V: 24, I_salida_A: 2.5, P_W: 60, eta: 0.88, I_limite_pct: 130, modo_limite: corriente_constante, t_retencion_ms: 20, U_entrada_min_V: 85}
      # T_max_C es el tope SIN desclasificar (a plena carga): la ficha sólo da el tope con
      # desclasificación y la rodilla está en la gráfica, no en el texto (decisión D-b)
      a_confirmar: [T_max_C]
      fuente: "Mean Well, HDR-60-SPEC (2026-10-09), https://www.meanwell.com/Upload/PDF/HDR-60/HDR-60-SPEC.PDF (consultada 2026-10-26), pág. 1: «WORKING TEMP. −30 ~ +70 °C (Refer to Derating Curve)»: 70 °C es el tope CON desclasificación; la temperatura a plena carga sólo está en la curva de desclasificación (pág. 3) y no se lee como número del texto: a confirmar. Phoenix Contact UNO POWER sin ficha leída (su web responde 403)"
      nota: "Los bornes L y N son los de la ENTRADA: en una red sin neutro van a dos fases."
  - ref: FUENTE-24VDC-5A
    name: Fuente 24 VDC 5 A (riel DIN)
    description: Fuente conmutada de riel DIN, entrada 100-240 VAC (en Lima, entre dos fases de 220 V), salida 24 VDC 5 A (120 W) para el mando de un tablero con PLC. Verificar con el proveedor.
    builder: fuente_riel
    params: {width: 72, depth: 60, height: 90}
    zonas: *zonas_fuente
    tablero: {bornes: *fuente_caras}
    weight: 0.35
    specs: {tension_entrada: "100-240 VAC", tension_salida: "24 VDC", corriente_A: 5, potencia_W: 120, modulos_DIN: 4, linea_referencia: "orden de Phoenix Contact UNO POWER 24 V 5 A / Mean Well EDR-120-24", cotas_verificadas: false, cost: 55}
    electrico:
      <<: *fuente_24
      perdidas_W: 14
      modelo: {tipo: fuente, U_salida_V: 24, I_salida_A: 5, P_W: 120, eta: 0.89, I_limite_pct: 130, modo_limite: corriente_constante, t_retencion_ms: 20, U_entrada_min_V: 85}
      a_confirmar: [T_max_C]
      fuente: "Mean Well, EDR-120-SPEC (2026-03-31), https://www.meanwell.com/Upload/PDF/EDR-120/EDR-120-SPEC.PDF (consultada 2026-10-26), pág. 2: «WORKING TEMP. −20 ~ +60 °C (Refer to Derating Curve)»: 60 °C es el tope CON desclasificación; la temperatura a plena carga sólo está en la curva de desclasificación (pág. 3) y no se lee como número del texto: a confirmar. Phoenix Contact UNO POWER sin ficha leída (su web responde 403)"
