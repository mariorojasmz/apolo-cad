category: aire_comprimido
# Accesorios del circuito de aire (plan V8.9 D16, F7b: los huecos que encontró la verificación por
# MCP, F7 § 5 defecto 12). Cada ref es un EJEMPLO por FUNCIÓN: quien fabrica la reemplaza por la
# equivalente de su proveedor que dé la misma conexión (rosca del puerto, Ø del tubo) y un caudal
# no menor. Líneas de referencia (P1 de V8.9, provisoria): Festo y SMC como gama alta, Airtac como
# económica; `linea_referencia` sólo cita «del orden de».
#
#  - Regulador de caudal unidireccional EN LÍNEA (tubo a tubo, racor instantáneo en las dos
#    puntas): el modelo del carril lo pone entre dos tubos (`add_tubo` a sus puertos 1 y 2); el
#    sentido REGULADO va de 2 a 1, así que el puerto 2 mira al cilindro y regula el ESCAPE (la
#    regla «regulación de velocidad» de la F4). El ajuste `C_regulado` lo fija el instalador.
#  - Silenciador de bronce sinterizado roscado al escape de una válvula: en el carril se une al
#    escape con un `add_tubo` SIN `largo_m`, que la BOM lee como roscado DIRECTO al puerto (ni
#    tubo ni racor que comprar: `library/bom_electrico.py`).
#  - Racor recto macho instantáneo (rosca del puerto × Ø exterior del tubo): la BOM los cuenta
#    solos, uno por cada extremo de tubo en un puerto ROSCADO (un puerto «Ø6» ya es instantáneo).
# Fuentes y a confirmar: ninguna ficha de proveedor se leyó en la F7b. Caudal, presión, área
# efectiva, peso y envolvente son el ORDEN de las líneas citadas y van TODOS en `a_confirmar`
# (criterio de diseño hasta leer la ficha del proveedor). El C del regulador sale del Qn con la
# fórmula de ISO 6358 en su punto (6 → 5 bar), como el de las válvulas. El área efectiva S del
# silenciador entra convertida (tobera ideal, C ≈ 0,199·S: `neumatica/iso6358.py`).
# cost = USD REFERENCIAL (mercado de Lima, aprox.): actualizar con el proveedor.
components:
