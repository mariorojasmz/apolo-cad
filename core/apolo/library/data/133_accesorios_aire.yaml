    builder: box
    params: {width: 14, depth: 50, height: 22}
    weight: 0.02
    specs: {tubo_D_ext_mm: 6, linea_referencia: "orden de SMC AS1002F-06 / Festo GRLA-QS-6 en línea / Airtac PSL-6", a_confirmar: "caudal libre y regulado, presión, envolvente y peso", cotas_verificadas: false, cost: 9}
    neumatico:
      funcion: RZ
      simbolo: regulador_caudal
      fuente: "orden de las líneas citadas (sin ficha leída en la F7b): todo en a_confirmar"
      puertos:
        - {id: "1", rol: entrada, rosca: Ø6}
        - {id: "2", rol: salida, rosca: Ø6}
      modelo: {tipo: regulador_caudal, p_max_bar: 10, C_regulado: [0.02, 0.9], caudal: {Qn_l_min: 230, referencia: ANR, p1_bar: 6, p2_bar: 5, b: 0.3}}
      a_confirmar: [p_max_bar, C_regulado, caudal.Qn_l_min, caudal.referencia, caudal.b]
