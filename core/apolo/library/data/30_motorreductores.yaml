category: motorreductores
# Motorreductores helicoidales (motor + reductor). Builder: motor. El cuerpo del motor
# (motor_d, motor_len) usa dimensiones aprox del frame IEC real (TEFC): 037->IEC71,
# 075->IEC80, 150->IEC90. box_size = tamaño representativo del reductor.
# cost = USD REFERENCIAL (mercado aprox.; actualizar con proveedor para cotizar en firme).
#
# ELÉCTRICO (plan V8.1 D5/D6): bornes de la caja del motor según IEC 60034-8 (U1 V1 W1; el
# puente triángulo/estrella va dentro de la caja) + PE. La carga sigue la `tension` de specs.
# PLACA (`electrico.modelo`): valores TÍPICOS de un motor IEC de 4 polos a 60 Hz (η y cosφ del
# orden de IE1/IE2), con In = P/(√3·U·η·cosφ) a la tensión `U_V` en la `conexion` indicada.
# No son la placa de un modelo concreto: verificar con la placa del proveedor. El bloque no
# toca la geometría (sin bump de GEOM_CACHE_EPOCH).
# CO-SIMULACIÓN (plan V8.3 D7/D8, `tipo: motor`): `J_kgm2` = inercia del rotor (orden de los
# catálogos de motores TEFC IEC de 4 polos de esa potencia; la estimación por potencia de V8.2
# queda sólo para una placa manual); `I0_A` = corriente en vacío (criterio de diseño: orden de
# los catálogos IE1/IE2 de 4 polos, I0 ≈ 0,4–0,7 In según la potencia y siempre menor que la
# componente reactiva In·sen φ); verificar ambas con la placa o el protocolo de ensayo.
# REDUCTOR: `i` = rpm del motor / `rpm_salida` de specs (un AJUSTE de add_device si la unidad
# real trae otra relación) y `eta_reductor` = 0,94 (criterio de diseño: helicoidal de 2-3
# trenes, ~0,98 por tren; verificar con el fabricante).
_bornes_motor: &bornes_motor
  - {id: U1, rol: potencia}
  - {id: V1, rol: potencia}
  - {id: W1, rol: potencia}
  - {id: PE, rol: tierra}
