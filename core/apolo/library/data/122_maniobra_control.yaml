category: maniobra_control
# Maniobra y control de la faja piloto (plan V8.1 D6): contactores, bloque auxiliar, relés de
# interfaz y PLC compacto. Convenciones del catálogo eléctrico: ver la cabecera de
# 120_alimentacion_electrica.yaml.
#  - Contactores: Ie en AC-3 (≤ 440 V) y potencia de motor AC-3 a 220-240 V del orden de TeSys D
#    LC1D09/12/18 (sufijo BD = bobina 24 VDC, M7 = 220 VAC). Polos 1-2/3-4/5-6 NA, auxiliares
#    13-14 NA y 21-22 NC, bobina A1-A2. Tiempos de cierre/apertura: orden de magnitud de la
#    ficha (los usa la simulación de V8.3), verificar.
#  - PLC: E/S del orden de un Siemens S7-1200 CPU 1214C DC/DC/DC: entradas tipo sumidero (un
#    sensor PNP entra con 1M a 0 V), salidas de transistor tipo fuente alimentadas por 3L+/3M,
#    analógicas 0-10 V con 2M. La fuente de 24 V para sensores del propio PLC no se modela:
#    los sensores se alimentan de la fuente del tablero.
#  - `electrico.modelo` (plan V8.3 D7; convención en 120_alimentacion_electrica.yaml):
#    · contactor: `Uc_V`/`Uc` = la bobina (la misma tensión que su carga A1-A2); cierra desde
#      U_cierre_pct = 85 % de Uc (IEC 60947-4-1: cierra entre 85 y 110 % de Us) y cae por debajo
#      de U_caida_pct = 40 % (criterio de diseño dentro de la banda de la norma, que lo hace caer
#      entre 75 y 20 % de Us en AC y entre 75 y 10 % en DC); entre los dos conserva su estado.
#      Los tiempos `cierre_ms`/`apertura_ms` son la banda de la ficha: se toma el punto medio.
#    · relé de interfaz: opera desde 80 % y cae bajo 25 % de Uc (criterio de diseño: orden de la
#      ficha de la línea, que opera desde ~0,8 Un, retiene hasta ~0,4 Un y garantiza la caída a
#      0,1 Un); bobina y tiempos del orden de su ficha (verificar).
#    · PLC: entradas IEC 61131-2 tipo 1 (los umbrales ON ≥ 15 V / OFF ≤ 5 V son de la norma y van
#      en el modelo); `DI_filtro_ms` = 6,4 (filtro de fábrica de la línea de referencia);
#      `DO_retardo_ms` = 0,003 (conmutación de una salida de transistor de la línea: µs, nada
#      frente al intercambio de 2 ms); `U_alim_min_V` = 20,4 (IEC 61131-2: 24 VDC − 15 %);
#      `AI_escala` = 27648 a 10 V (plan V8.3 D4, como S7).
_contactor_bornes: &contactor_bornes
  - {id: "1", rol: potencia, lado: linea}
  - {id: "2", rol: potencia, lado: carga}
  - {id: "3", rol: potencia, lado: linea}
  - {id: "4", rol: potencia, lado: carga}
  - {id: "5", rol: potencia, lado: linea}
  - {id: "6", rol: potencia, lado: carga}
  - {id: A1, rol: bobina}
  - {id: A2, rol: bobina}
  - {id: "13", rol: contacto}
  - {id: "14", rol: contacto}
  - {id: "21", rol: contacto}
  - {id: "22", rol: contacto}
_contactor_caminos: &contactor_caminos
  - {de: "1", a: "2", tipo: NA, accion: bobina}
  - {de: "3", a: "4", tipo: NA, accion: bobina}
  - {de: "5", a: "6", tipo: NA, accion: bobina}
  - {de: "13", a: "14", tipo: NA, accion: bobina}
  - {de: "21", a: "22", tipo: NC, accion: bobina}
