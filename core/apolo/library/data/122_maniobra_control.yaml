  # Dos canales con rearme vigilado, del orden de Pilz PNOZ X2.8P / Schneider Preventa XPSAC:
  # S11, S21 y S33 salen de A1 por dentro (criterio de diseño: la vigilancia de cruces entre
  # canales no se modela) y vuelven por el contacto externo a S12, S22 (canales) y S34 (rearme:
