    params: {width: 22.5, depth: 114, height: 99}
    weight: 0.2
    specs: {canales: 2, rearme: vigilado, salidas: "3NA de seguridad + 1NC de señal", alimentacion: "24 VDC", ancho_mm: 22.5, linea_referencia: "orden de Pilz PNOZ X2.8P / Schneider Preventa XPSAC5121", cotas_verificadas: false, cost: 160}
