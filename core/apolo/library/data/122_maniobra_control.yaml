      montaje: din
      perdidas_W: 2
      bornes:
        - {id: A1, rol: mando}
        - {id: A2, rol: mando}
        - {id: S11, rol: señal}
        - {id: S12, rol: señal}
        - {id: S21, rol: señal}
        - {id: S22, rol: señal}
        - {id: S33, rol: señal}
        - {id: S34, rol: señal}
        - {id: "13", rol: contacto}
        - {id: "14", rol: contacto}
        - {id: "23", rol: contacto}
        - {id: "24", rol: contacto}
        - {id: "33", rol: contacto}
        - {id: "34", rol: contacto}
        - {id: "41", rol: contacto}
        - {id: "42", rol: contacto}
      caminos:
        - {de: A1, a: S11, tipo: fijo}
        - {de: A1, a: S21, tipo: fijo}
        - {de: A1, a: S33, tipo: fijo}
        - {de: "13", a: "14", tipo: NA, accion: señal, grupo: salida_13}
        - {de: "23", a: "24", tipo: NA, accion: señal, grupo: salida_23}
        - {de: "33", a: "34", tipo: NA, accion: señal, grupo: salida_33}
        - {de: "41", a: "42", tipo: NC, accion: señal, grupo: aux}
      cargas:
        - {bornes: [A1, A2], tension: "24 VDC", tipo: alimentacion, polar: true}
        - {bornes: [S12, A2], tension: "24 VDC", tipo: entrada, polar: true}
        - {bornes: [S22, A2], tension: "24 VDC", tipo: entrada, polar: true}
        - {bornes: [S34, A2], tension: "24 VDC", tipo: entrada, polar: true}
      modelo: {tipo: rele_seguridad, Un_V: 24, U_min_pct: 85, rearme: vigilado, salidas: ["13-14", "23-24", "33-34"], t_conexion_ms: 50, t_desconexion_ms: 20}
