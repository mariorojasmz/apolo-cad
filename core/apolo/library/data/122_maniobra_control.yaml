  # tipo 1; funciona desde U_min_pct = 85 % de Un (orden de la ficha de la línea, 0,85–1,1 Un);
  # `t_conexion_ms` y `t_desconexion_ms` del orden de la ficha (≤ 20 ms en la apertura),
  # verificar. Sin datos de fiabilidad (B10d, PFHd): no son del núcleo.
