      funcion: Q
      simbolo: contactor_3p
      montaje: din
      perdidas_W: 3
      bornes: *contactor_bornes
      caminos: *contactor_caminos
      cargas: [{bornes: [A1, A2], tension: "24 VDC", tipo: bobina}]
      modelo: {tipo: contactor, Ie_AC3_A: 9, P_AC3_kW_220V: 2.2, Uc_V: 24, Uc: DC, U_cierre_pct: 85, U_caida_pct: 40, bobina_W: 2.4, cierre_ms: [53, 73], apertura_ms: [16, 24]}
