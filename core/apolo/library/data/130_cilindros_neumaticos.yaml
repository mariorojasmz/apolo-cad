category: cilindros_neumaticos
# Cilindros neumáticos genéricos (plan V8.9 D16). Cada ref es un EJEMPLO por FUNCIÓN: quien
# fabrica la reemplaza por cualquier cilindro de la MISMA norma de cotas (ISO 15552 o ISO 6432),
# el mismo Ø de pistón y vástago, la carrera pedida y una amortiguación que admita la energía de
# su ficha. Líneas de referencia (P1 de V8.9, provisoria): Festo y SMC como gama alta, Airtac como
# económica; `linea_referencia` sólo cita «del orden de».
#
# Ficha neumática (`library/neumatica/ficha.py`): puertos A (fondo) y B (vástago) — «criterio de
# diseño» a confirmar con ISO 1219-2 —, `modelo` con todo lo que pide el cálculo y `fuente`.
# Fuentes de las cifras (lo que no tiene fuente va en `a_confirmar`):
#  [F1] SMC, manual de operación del C96 (ISO 15552), Doc. no. C96*-OM0001Q: presión de trabajo
#       0,05–1,0 MPa, velocidad 50–1000 mm/s y energía cinética admisible con amortiguación
#       neumática (tabla 1): Ø32 2,3 J · Ø40 3,6 J · Ø50 6,1 J · Ø63 11,4 J.
#  [F2] SMC, hojas de datos C96SDB32-100C y CP96SDB63-60C (smc.eu, 2024): rosca de vástago M10×1,25
#       y M16×1,5, puertos G1/8 y G3/8, fuerza teórica a 0,5 MPa 402/346 N (Ø32) y 1559/1402 N
#       (Ø63) ⇒ vástago Ø12 y Ø20; masa 0,650 kg (Ø32, carrera 100) y 1,864 kg (Ø63, carrera 60);
#       carrera estándar hasta 1900 mm (C96) y 2000 mm (CP96).
#  [F3] AVENTICS, catálogo «ISO 15552 Series CCL» (Emerson 6907744), tabla de dimensiones, leída
#       por extracto (a confirmar contra el PDF): vástago Ø16 y Ø20, rosca M12×1,25 y M16×1,5,
#       puertos G1/4 para Ø40 y Ø50.
#  [F4] Flowtech, hoja «ISO15552 Cylinders» (TS3016/TS3017), tabla de montajes: distancia entre
#       tirantes TG (T) 32,5 / 38 / 46,5 / 56,5 mm, largo del cuerpo en carrera 0 (C) 94 / 105 /
#       106 / 121 mm y total con el extremo del vástago (A) 142 / 159 / 175 / 190 mm. Sus tablas
#       FA (brida) y LB (pie) están en `library/neumatica/montajes.py` (V8.9 F2).
#  [F5] Hydraquip, hoja técnica TS10287 «ISO 6432 Stainless Steel Mini Cylinders»: vástago Ø6 /
#       Ø8 / Ø10, rosca M6 / M8 / M10×1,25, nariz M16×1,5 / M22×1,5 / M22×1,5, puertos M5 / G1/8 /
#       G1/8, presión 0,2–1,0 MPa, carreras estándar 10–320 mm, amortiguación elástica. Tabla de
#       dimensiones (letras de la hoja, leídas sin su dibujo: a confirmar): D 19/27/30 (Ø de la
#       camisa), C 12/16/16 (largo de la nariz), E 6/8/8 (Ø del pasador trasero), K 22/24/28 (WH),
#       L 16/20/22 (AM, rosca del vástago), N 9/12/12 (ancho del ojo) y 82/95/104 (XC, del pasador
#       al hombro del vástago).
#  [F6] Listado de distribuidor del SMC C85 (ISO 6432) con amortiguación elástica: 0,02 a 0,4 J
#       para Ø8–25 (sin valor por Ø: los de Ø16 y Ø20 quedan a confirmar).
# Criterios de diseño (en `a_confirmar` cuando son estimaciones):
#  - masa por mm de carrera = vástago macizo de acero (7850 kg/m³): π·d²/4·ρ;
#  - volumen muerto por cámara ≈ área × 5 mm (holgura de amortiguación y conductos internos);
#  - masa móvil en carrera 0 (pistón, tuerca y el tramo de vástago que queda dentro);
#  - fricción de sellos 10 % de la fuerza teórica (orden de la regla de selección de catálogo);
#  - builder propio (`library/builders_neumatica.py`, V8.9 F2: cuerpo y vástago retraídos; el
#    super-comando `create_pneumatic_cylinder` los separa con su junta). `params`: D, d, E (lado
#    del cuerpo cuadrado de ISO 15552 o Ø de la camisa de ISO 6432), C, WH, AM, KK (Ø nominal de
#    la rosca del vástago), puerto, TG, tapa (rosca de los 4 tornillos de cada tapa), XC, nariz,
#    nariz_l, CD, EW. E de Ø50 y Ø63 (64 y 75 mm) de los listados del Festo DSBC, los de Ø32 y Ø40
#    a confirmar; WH = A − C − AM con el AM de memoria y la rosca de las tapas (M6 Ø32/40, M8
#    Ø50/63), a confirmar; peso en carrera 0 a confirmar.
_puertos_g18: &puertos_g18
  - {id: A, rol: trabajo, rosca: G1/8}
  - {id: B, rol: trabajo, rosca: G1/8}
_puertos_g14: &puertos_g14
  - {id: A, rol: trabajo, rosca: G1/4}
  - {id: B, rol: trabajo, rosca: G1/4}
