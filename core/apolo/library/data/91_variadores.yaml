  # frame B): verificar cotas y precio con el proveedor antes de cotizar en firme.
  - ref: VFD-2K2-220
    name: Variador 2.2 kW 220V 3F
    description: Variador de frecuencia (VFD) 2.2 kW / 3 HP, entrada y salida 220 V trifásica, control vectorial sensorless + STO (entrada de seguridad para el lazo de setas de emergencia), rampa de arranque para fajas con motorreductor de 2.2 kW.
    builder: box
    params: {width: 140, depth: 145, height: 160}
    weight: 1.7
    specs: {potencia_kW: 2.2, potencia_HP: 3, tension: "220V 3F", corriente_A: 11.0, control: "vectorial sensorless", proteccion: STO, cost: 280}
    electrico:
      funcion: T
      simbolo: variador
      montaje: placa
      protege_motor: true
      perdidas_W: 90
      bornes: *vfd_bornes
      caminos: *vfd_caminos
      cargas: *vfd_cargas
      fuentes: *vfd_fuentes
      modelo: {<<: *vfd_mando, P_kW: 2.2, I_salida_A: 11.0, I_entrada_A: 13, sobrecarga_pct: 150, sobrecarga_s: 60, control: "V/f o vectorial sensorless", STO: true}
