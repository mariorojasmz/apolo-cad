    builder: box
    params: {width: 140, depth: 145, height: 160}
    weight: 1.7
    specs: {potencia_kW: 2.2, potencia_HP: 3, tension: "220V 3F", corriente_A: 11.0, control: "vectorial sensorless", proteccion: STO, cost: 280}
    electrico:
      funcion: T
      simbolo: variador
      montaje: placa
      protege_motor: true
      perdidas_W: 90
      bornes: *vfd_bornes
      caminos: *vfd_caminos
      cargas: *vfd_cargas
      fuentes: *vfd_fuentes
