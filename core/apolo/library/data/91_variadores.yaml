    name: Variador 1.5 kW 220V 3F
    description: Variador de frecuencia (VFD) 1.5 kW / 2 HP, salida 220 V trifásica, control vectorial sensorless + STO, para faja de banda 0.5-1.0 m/s.
    builder: box
    params: {width: 90, depth: 160, height: 200}
    weight: 1.2
    specs: {potencia_kW: 1.5, potencia_HP: 2, tension: "220V 3F", corriente_A: 8.5, control: "vectorial sensorless", proteccion: STO, cost: 240}
    electrico:
      funcion: T
      simbolo: variador
      montaje: placa
      protege_motor: true
      perdidas_W: 60
      bornes: *vfd_bornes
      caminos: *vfd_caminos
      cargas: *vfd_cargas
      fuentes: *vfd_fuentes
      modelo: {<<: *vfd_mando, P_kW: 1.5, I_salida_A: 8.5, I_entrada_A: 10, sobrecarga_pct: 150, sobrecarga_s: 60, control: "V/f o vectorial sensorless", STO: true}
  # Para el NMRV-090 (motor 2.2 kW) de la faja 38: el de 1.5 kW quedaba corto. Envolvente
