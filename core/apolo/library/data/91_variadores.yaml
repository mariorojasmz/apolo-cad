category: variadores
# ELÉCTRICO (plan V8.1 D5): bornes GENÉRICOS de un variador compacto (los nombres reales cambian
# por fabricante; ver el manual): potencia L1 L2 L3 → U V W + PE; entradas digitales DI1-DI4
# con común COM (modo fuente/PNP: DI positiva respecto de COM); analógica AI1 con GND y la
# fuente de +10 V para el potenciómetro; relé de falla RA (NA) / RB (NC) / RC (común); entradas
# de seguridad STO S1, S2 con común SCM (sin 24 V en S1 y S2 el variador no da par: se puentean
# a 24 V o se cablean por la seta). La fuente interna de +24 V del variador no se modela:
# alimenta las entradas desde la fuente de 24 VDC del tablero. Protege al motor (I²t
# electrónico): `protege_motor`. perdidas_W ≈ 4 % de la potencia (estimación). El bloque no toca
# la geometría (sin bump de GEOM_CACHE_EPOCH). cost = USD REFERENCIAL (mercado de Lima, aprox.):
# actualizar con el proveedor para cotizar en firme.
#
# CO-SIMULACIÓN (plan V8.3 D7, `tipo: variador`, modelo PROMEDIO): lo de mando es la
# PROGRAMACIÓN del variador, así que cada clave es un ajuste de add_device; los valores de aquí
# son de FÁBRICA o criterio de diseño:
#  - rampas `acel_s`/`decel_s` = 10 s de 0 a f_max (orden del valor de fábrica de un compacto);
#    `f_min_Hz` 0, `f_max_Hz` y `f_base_Hz` 60 (perfil Perú, V8 D11); V/f lineal hasta f_base;
#  - función de cada DI (marcha_adelante | marcha_atras | rearme | f_fija_b0 | f_fija_b1 |
#    ninguna; criterio de diseño, del orden de la asignación de fábrica): DI1 adelante, DI2 atrás,
#    DI3 rearme, DI4 bit 0 de frecuencia fija. Las DI y el STO son entradas de 24 V que cambian
#    con los umbrales de IEC 61131-2 tipo 1 (≥ 15 V / ≤ 5 V);
#  - consigna `AI1` (0–`AI1_V_max` V → f_min–f_max) o `fija` (`f_consigna_Hz`); con los bits de
#    frecuencia fija, 1/2/3 → `f_fija1..3_Hz` (15/30/45 Hz: criterio de diseño, la fábrica los
#    deja en 0);
#  - límite de corriente `I_limite_pct` = 150 % de I_salida (la sobrecarga de placa): al tocarlo
#    baja la frecuencia con la rampa de deceleración; falla `sobrecorriente` a
#    `I_sobrecorriente_pct` = 200 % (criterio de diseño: el disparo por hardware de un compacto
#    ronda 200–250 %); falla `sobrecarga` por I²t con la placa (150 % durante 60 s desde
#    régimen nominal);
#  - STO de dos canales (S1, S2): sin 24 V en cualquiera de ellos, el par se corta en
#    `STO_reaccion_ms` = 10 (orden de la ficha; IEC 61800-5-2 define la función, no el tiempo) y
#    no rearranca sin una orden de marcha NUEVA (IEC 60204-1: reponer una parada no rearranca
#    la máquina por sí solo);
#  - `I_entrada_A` a potencia nominal (orden de la ficha: rectificador de 6 pulsos sin reactancia);
#    falla `subtension` si la red cae bajo `U_min_pct` = 70 % de U_V más de `t_retencion_ms` = 20
#    con el motor girando, y `perdida_fase` si una tensión de línea cae bajo la mitad de las
#    otras durante `t_perdida_fase_s` = 1 (criterio de diseño ambos: verificar con el manual).
_vfd_mando: &vfd_mando
  tipo: variador
  U_V: 220
  f_min_Hz: 0
  f_max_Hz: 60
  f_base_Hz: 60
  acel_s: 10
  decel_s: 10
  consigna: AI1
  AI1_V_max: 10
  f_consigna_Hz: 60
  DI1_funcion: marcha_adelante
  DI2_funcion: marcha_atras
  DI3_funcion: rearme
  DI4_funcion: f_fija_b0
  f_fija1_Hz: 15
  f_fija2_Hz: 30
  f_fija3_Hz: 45
  I_limite_pct: 150
  I_sobrecorriente_pct: 200
  STO_reaccion_ms: 10
  U_min_pct: 70
  t_retencion_ms: 20
  t_perdida_fase_s: 1
_vfd_bornes: &vfd_bornes
  - {id: L1, rol: potencia, lado: linea}
  - {id: L2, rol: potencia, lado: linea}
  - {id: L3, rol: potencia, lado: linea}
  - {id: U, rol: potencia, lado: carga}
  - {id: V, rol: potencia, lado: carga}
  - {id: W, rol: potencia, lado: carga}
  - {id: PE, rol: tierra}
  - {id: DI1, rol: señal}
  - {id: DI2, rol: señal}
  - {id: DI3, rol: señal}
  - {id: DI4, rol: señal}
  - {id: COM, rol: señal}
  - {id: AI1, rol: señal}
  - {id: +10V, rol: señal}
  - {id: GND, rol: señal}
  - {id: RA, rol: contacto}
  - {id: RB, rol: contacto}
  - {id: RC, rol: contacto}
  - {id: S1, rol: señal}
  - {id: S2, rol: señal}
  - {id: SCM, rol: señal}
_vfd_caminos: &vfd_caminos
  - {de: RC, a: RA, tipo: NA, accion: señal, grupo: rele_falla}
  - {de: RC, a: RB, tipo: NC, accion: señal, grupo: rele_falla}
_vfd_cargas: &vfd_cargas
  - {bornes: [L1, L2, L3], tension: "220 VAC 3F", tipo: alimentacion}
  - {bornes: [DI1, COM], tension: "24 VDC", tipo: entrada, obligatoria: false, polar: true}
  - {bornes: [DI2, COM], tension: "24 VDC", tipo: entrada, obligatoria: false, polar: true}
  - {bornes: [DI3, COM], tension: "24 VDC", tipo: entrada, obligatoria: false, polar: true}
  - {bornes: [DI4, COM], tension: "24 VDC", tipo: entrada, obligatoria: false, polar: true}
  - {bornes: [AI1, GND], tension: "0-10 VDC", tipo: entrada, obligatoria: false, polar: true}
  - {bornes: [S1, SCM], tension: "24 VDC", tipo: entrada, polar: true}
  - {bornes: [S2, SCM], tension: "24 VDC", tipo: entrada, polar: true}
_vfd_fuentes: &vfd_fuentes
  - {polos: {U: L1, V: L2, W: L3}, tension: "220 VAC 3F"}
  - {polos: {+10V: "+", GND: "-"}, tension: "10 VDC"}
components:
