category: tableros
# ELÉCTRICO (plan V8.1 D5): un gabinete metálico tiene su borne de tierra (PE): la regla
# «puesta a tierra» del ERC exige unirlo a la red PE. El bloque no toca la geometría de las refs
# que ya existían (sin bump de GEOM_CACHE_EPOCH). Los gabinetes GAB-* son del catálogo eléctrico
# de la faja piloto (D6): convenciones en la cabecera de 120_alimentacion_electrica.yaml; cotas
# alto × ancho × fondo.
_gabinete: &gabinete
  funcion: U
  simbolo: gabinete
  montaje: campo
  bornes: [{id: PE, rol: tierra}]
