category: tableros
# ELÉCTRICO (plan V8.1 D5): un gabinete metálico tiene su borne de tierra (PE): la regla
# «puesta a tierra» del ERC exige unirlo a la red PE. El bloque no toca la geometría de las refs
# que ya existían (sin bump de GEOM_CACHE_EPOCH). Los gabinetes GAB-* son del catálogo eléctrico
# de la faja piloto (D6): convenciones en la cabecera de 120_alimentacion_electrica.yaml; cotas
# alto × ancho × fondo.
# ARMADO (plan V8.5 A2): `tablero.gabinete` = el interior (placa útil ancho × alto, fondo útil de
# la placa a la puerta, placa–fondo, espesores, bisagra vista de frente, placa pasacables); lo lee
# la colocación del layout, no el builder (la caja sigue maciza: sin bump de GEOM_CACHE_EPOCH).
# Cotas del orden de la línea, SIN verificar: la placa útil ≈ la caja − 50 mm en ancho y en alto.
_gabinete: &gabinete
  funcion: U
  simbolo: gabinete
  montaje: campo
  bornes: [{id: PE, rol: tierra}]
components:
  - ref: TABLERO-5040
    name: Tablero de control 500x400x200
    description: Gabinete metálico IP54 500x400x200 mm para variador, protecciones, contactor y borneras.
    builder: box
    params: {width: 500, depth: 200, height: 400}
    tablero: {gabinete: {placa_util_mm: [450, 350], fondo_util_mm: 160, placa_fondo_mm: 25, espesor_mm: 1.5, espesor_puerta_mm: 1.5, bisagra: izquierda, pasacables: {cara: inferior, ancho_mm: 400, fondo_mm: 120}, linea_referencia: "orden de Schneider Spacial S3D (placa de montaje NSYMM, placa pasacables inferior) / ABB / Chint", cotas_verificadas: false}}
    weight: 12.0
    specs: {ancho_mm: 500, alto_mm: 400, fondo_mm: 200, proteccion: IP54, material: "acero pintado", linea_referencia: "orden de Schneider Spacial S3D (500x400x200) / Rittal AX", cotas_verificadas: false, cost: 150}
    electrico: *gabinete
