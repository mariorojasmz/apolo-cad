  - ref: COND-H07VK-4
    name: Conductor flexible H07V-K 4 mm²
    description: Conductor de cobre flexible clase 5 con aislamiento de PVC, 4 mm², 450/750 V, por metro, para la alimentación del tablero. En Perú el THW-90 es para instalación fija; en tablero se pide el flexible clase 5 (verificar con el proveedor).
