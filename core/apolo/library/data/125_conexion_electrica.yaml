    specs: {seccion_mm2: 4, tension_aislamiento: "450/750 V", norma: "EN 50525-2-31 (H07V-K)", linea_referencia: "orden de LAPP ÖLFLEX H07V-K", cotas_verificadas: false, cost_por_m: 0.55}
    electrico:
