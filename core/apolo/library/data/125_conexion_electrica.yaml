      conductor: {seccion_mm2: 4, tension_aislamiento: "450/750 V", temperatura_C: 70}
  # ── cables multipolares (por metro) ─────────────────────────────────────────────────────
  - ref: CABLE-4G1.5
    name: Cable flexible 4G1,5
    description: Cable flexible multipolar 4G1,5 mm² (3 fases + PE), PVC 300/500 V, hilos negros numerados 1-2-3 + verde-amarillo, por metro, para alimentar un motor de hasta ~2,2 kW a 220 V. Equivalente local de uso común - cordón NMT de 4 hilos - verificar con el proveedor sección, tensión y colores.
    builder: cylinder
    params: {diameter: 8.4}
    cuttable: true
    default_length: 1000
    weight: 0.12
    specs: {seccion_mm2: 1.5, hilos: "4G (3 + PE)", tension_aislamiento: "300/500 V", linea_referencia: "orden de LAPP ÖLFLEX CLASSIC 110 4G1,5", cotas_verificadas: false, cost_por_m: 1.3}
