category: conexion_electrica
# Conexión de la faja piloto (plan V8.1 D6): borneras, conductores y cables. Convenciones del
# catálogo eléctrico: ver la cabecera de 120_alimentacion_electrica.yaml.
#  - Borneras (`bornera: true`): la ficha declara UNA unidad; `add_device(cantidad=N)` la repite
#    (bornes «1»…«N»; el portafusible, «k.1»/«k.2»). Un borne de paso es un solo punto: todos
#    los conductores que llegan a «-X1:3» quedan unidos.
#  - Conductores y cables: cortables, peso en kg/m y `cost_por_m`; el builder es el cilindro de
#    su diámetro exterior. Los conductores sueltos no llevan bornes (el `add_wire` los nombra en
#    `tipo`); los cables multipolares declaran sus hilos (id + color IEC 60757).
#  - H07V-K (450/750 V) empieza en 1,5 mm²; 0,75 y 1 mm² son H05V-K (300/500 V), ambos de la
#    EN 50525-2-31, cobre flexible clase 5, PVC 70 °C.
components:
  # ── borneras ────────────────────────────────────────────────────────────────────────────
  - ref: BORNE-PASO-2.5
    name: Borne de paso 2,5 mm²
    description: Borne de paso de tornillo para riel DIN, 2,5 mm², gris, ancho 5,2 mm. Verificar con el proveedor.
    builder: box
    params: {width: 5.2, depth: 47, height: 42.5}
    weight: 0.007
    specs: {seccion_mm2: 2.5, ancho_mm: 5.2, linea_referencia: "orden de Phoenix Contact UT 2,5 / Weidmüller WDU 2.5", cotas_verificadas: false, cost: 0.8}
    electrico:
      funcion: X
      simbolo: borne_paso
      montaje: din
      bornera: true
      bornes: [{id: "1", rol: potencia}]
      modelo: {seccion_mm2: 2.5}
      a_confirmar: [T_max_C]
      fuente: &fuente_borne "sin ficha verificada de la línea de referencia (Phoenix Contact UT / Weidmüller WDU, WPE): la temperatura de servicio, a confirmar con el borne que se compre"
  - ref: BORNE-PASO-4
    name: Borne de paso 4 mm²
    description: Borne de paso de tornillo para riel DIN, 4 mm², gris, ancho 6,2 mm. Verificar con el proveedor.
    builder: box
    params: {width: 6.2, depth: 47, height: 42.5}
    weight: 0.009
    specs: {seccion_mm2: 4, ancho_mm: 6.2, linea_referencia: "orden de Phoenix Contact UT 4 / Weidmüller WDU 4", cotas_verificadas: false, cost: 1.0}
    electrico:
      funcion: X
      simbolo: borne_paso
      montaje: din
      bornera: true
      bornes: [{id: "1", rol: potencia}]
      modelo: {seccion_mm2: 4}
      a_confirmar: [T_max_C]
      fuente: *fuente_borne
  - ref: BORNE-PE-2.5
    name: Borne de tierra 2,5 mm²
    description: Borne de protección (PE) verde-amarillo de tornillo, 2,5 mm², ancho 5,2 mm; hace contacto con el riel DIN, que a su vez se une a la placa y al gabinete. Verificar con el proveedor.
    builder: box
    params: {width: 5.2, depth: 47, height: 42.5}
    weight: 0.012
    specs: {seccion_mm2: 2.5, ancho_mm: 5.2, linea_referencia: "orden de Phoenix Contact UT 2,5-PE / Weidmüller WPE 2.5", cotas_verificadas: false, cost: 2.0}
    electrico:
      funcion: X
      simbolo: borne_pe
      montaje: din
      bornera: true
      bornes: [{id: "1", rol: tierra}]
      modelo: {seccion_mm2: 2.5}
      a_confirmar: [T_max_C]
      fuente: *fuente_borne
  - ref: BORNE-PE-4
    name: Borne de tierra 4 mm²
    description: Borne de protección (PE) verde-amarillo de tornillo, 4 mm², ancho 6,2 mm; hace contacto con el riel DIN. Verificar con el proveedor.
    builder: box
    params: {width: 6.2, depth: 47, height: 42.5}
    weight: 0.015
    specs: {seccion_mm2: 4, ancho_mm: 6.2, linea_referencia: "orden de Phoenix Contact UT 4-PE / Weidmüller WPE 4", cotas_verificadas: false, cost: 2.5}
    electrico:
      funcion: X
      simbolo: borne_pe
      montaje: din
      bornera: true
      bornes: [{id: "1", rol: tierra}]
      modelo: {seccion_mm2: 4}
      a_confirmar: [T_max_C]
      fuente: *fuente_borne
  # `modelo` (plan V8.3 D7): el cartucho 5x20 es un AJUSTE de add_device (`cartucho_In_A`
  # dentro de lo que admite el portafusible; `cartucho_curva` F rápido o T temporizado, T por
  # defecto: criterio de diseño, el de un mando con bobinas y fuentes que piden corriente al
  # conectar). Sus bandas tiempo-corriente son de IEC 60127-2 y van en el modelo.
  - ref: BORNE-FUS-5X20
    name: Borne portafusible 5x20
    description: Borne portafusible de palanca para fusible de vidrio 5x20 mm (hasta 6,3 A), ancho 8,2 mm; protege un circuito de mando o una entrada de señal. Verificar con el proveedor.
    builder: box
    params: {width: 8.2, depth: 60, height: 62}
    weight: 0.02
    specs: {fusible: "5x20 mm", In_max_A: 6.3, ancho_mm: 8.2, linea_referencia: "orden de Phoenix Contact UT 4-HESI (5X20) / Weidmüller WSI 4", cotas_verificadas: false, cost: 3.5}
    electrico:
      funcion: F
      simbolo: borne_fusible
      montaje: din
      bornera: true
      bornes:
        - {id: "1", rol: potencia, lado: linea}
        - {id: "2", rol: potencia, lado: carga}
      caminos: [{de: "1", a: "2", tipo: proteccion}]
      modelo: {tipo: fusible, fusible: "5x20 mm", In_max_A: 6.3, cartucho_In_A: [0.05, 6.3], cartucho_curva: T}
      a_confirmar: [cartucho_U_V, cartucho_Icn_A, cartucho_Icn_x_In, T_max_C]
      fuente: "sin ficha verificada del cartucho 5x20 ni del portafusible (Phoenix Contact UT 4-HESI / Weidmüller WSI 4): el poder de corte y la tensión del cartucho (IEC 60127-2, según su hoja de norma: F o T, de bajo o alto poder de corte) y la temperatura de servicio, a confirmar"
  # ── conductores sueltos (por metro) ─────────────────────────────────────────────────────
  - ref: COND-H05VK-0.75
    name: Conductor flexible H05V-K 0,75 mm²
    description: Conductor de cobre flexible clase 5 con aislamiento de PVC, 0,75 mm², 300/500 V, por metro, para señales y mando de 24 VDC. En Perú se cotiza como cable flexible de tablero - verificar con el proveedor la tensión y la clase.
    builder: cylinder
    params: {diameter: 2.6}
    cuttable: true
    default_length: 1000
    weight: 0.011
    specs: {seccion_mm2: 0.75, tension_aislamiento: "300/500 V", norma: "EN 50525-2-31 (H05V-K)", linea_referencia: "orden de LAPP ÖLFLEX H05V-K", cotas_verificadas: false, cost_por_m: 0.12}
    electrico: &conductor
      funcion: W
      simbolo: conductor
      montaje: placa
      conductor: {seccion_mm2: 0.75, tension_aislamiento: "300/500 V", temperatura_C: 70}
      a_confirmar: [T_max_C]
      fuente: "EN 50525-2-31: 70 °C es la temperatura máxima del CONDUCTOR (`conductor.temperatura_C`), no la del aire alrededor; la del aire y su corrección de corriente admisible la fija la instalación (IEC 60364-5-52): a confirmar"
  - ref: COND-H05VK-1
    name: Conductor flexible H05V-K 1 mm²
    description: Conductor de cobre flexible clase 5 con aislamiento de PVC, 1 mm², 300/500 V, por metro, para el mando. En Perú se cotiza como cable flexible de tablero - verificar con el proveedor la tensión y la clase.
    builder: cylinder
    params: {diameter: 2.8}
    cuttable: true
    default_length: 1000
    weight: 0.014
    specs: {seccion_mm2: 1, tension_aislamiento: "300/500 V", norma: "EN 50525-2-31 (H05V-K)", linea_referencia: "orden de LAPP ÖLFLEX H05V-K", cotas_verificadas: false, cost_por_m: 0.15}
    electrico:
      <<: *conductor
      conductor: {seccion_mm2: 1, tension_aislamiento: "300/500 V", temperatura_C: 70}
  - ref: COND-H07VK-1.5
    name: Conductor flexible H07V-K 1,5 mm²
    description: Conductor de cobre flexible clase 5 con aislamiento de PVC, 1,5 mm², 450/750 V, por metro, para potencia de motores pequeños y mando a 220 V. En Perú el THW-90 (rígido o de 7 hilos) es para instalación fija; en tablero se pide el flexible clase 5 (verificar con el proveedor).
    builder: cylinder
    params: {diameter: 3.2}
