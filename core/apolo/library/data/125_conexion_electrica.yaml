      funcion: W
      simbolo: cable
      montaje: campo
      conductor:
        seccion_mm2: 1.5
        tension_aislamiento: "300/500 V"
        temperatura_C: 70
        hilos: [{id: "1", color: BK}, {id: "2", color: BK}, {id: "3", color: BK}, {id: PE, color: GNYE}]
