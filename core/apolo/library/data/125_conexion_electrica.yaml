    weight: 0.020
    specs: {seccion_mm2: 1.5, tension_aislamiento: "450/750 V", norma: "EN 50525-2-31 (H07V-K)", linea_referencia: "orden de LAPP ÖLFLEX H07V-K", cotas_verificadas: false, cost_por_m: 0.22}
    electrico:
      <<: *conductor
      conductor: {seccion_mm2: 1.5, tension_aislamiento: "450/750 V", temperatura_C: 70}
  - ref: COND-H07VK-2.5
    name: Conductor flexible H07V-K 2,5 mm²
    description: Conductor de cobre flexible clase 5 con aislamiento de PVC, 2,5 mm², 450/750 V, por metro, para potencia. En Perú el THW-90 es para instalación fija; en tablero se pide el flexible clase 5 (verificar con el proveedor).
    builder: cylinder
    params: {diameter: 3.8}
    cuttable: true
    default_length: 1000
    weight: 0.031
    specs: {seccion_mm2: 2.5, tension_aislamiento: "450/750 V", norma: "EN 50525-2-31 (H07V-K)", linea_referencia: "orden de LAPP ÖLFLEX H07V-K", cotas_verificadas: false, cost_por_m: 0.35}
    electrico:
